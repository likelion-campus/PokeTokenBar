name: windows
# Builds and tests the shared (non-Apple) part of the app on Windows. Informational: not a required check.
# Release mode (stage 8; scripts/team_release.py dispatches it): -f release_sha=<40 hex> -f release_version=<x.y.z> tests
# exactly that commit after the "Release pin" step (as in windows-app.yml), in its own never-cancelled concurrency group, and
# a passing run ends with the artifact windows-tests (windows-tests.json: executed, skipped and failure counts and cleanBuild, 7 days).
# Job graph: build (debug build of everything incl. the tests, incremental from the seed of the last windows-port run, fails fast on
# compile errors) -> test x4 (shards by test class, `swift test --skip-build`) and render (plaza harness) in parallel -> result (sums
# the shards, fails unless every listed test ran exactly once, writes windows-tests in release mode).
# Release mode and clean_build=true build from scratch: no seed (scripts/windows/seed-restore.ps1).
run-name: ${{ inputs.release_sha != '' && format('release {0} {1}', inputs.release_version, inputs.release_sha) || '' }}
on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Release mode: the 40-hex commit to build (set by team_release.py)'
        default: ''
      release_version:
        description: 'Release mode: the x.y.z that commit carries in scripts/build-app.sh'
        default: ''
      clean_build:
        description: 'Build from scratch, ignoring the seed of the last windows-port run (release mode and kit/* branches always do)'
        type: boolean
        default: false
      seed_trunk:
        description: 'The branch whose seed a branch without one of its own starts from (default windows-port; changed only to rehearse the seed logic)'
        default: 'windows-port'
permissions:
  contents: read
  actions: read   # the seed (.build of the last windows-port run) is an artifact of another run
concurrency:
  group: ${{ inputs.release_sha != '' && format('windows-release-{0}', inputs.release_sha) || format('windows-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.release_sha == '' && github.ref != 'refs/heads/windows-port' }}
jobs:
  build:
    runs-on: windows-latest
    # A cold build is about 10 min, an incremental one 2-4. Without a limit a stuck run would hold its concurrency group (a
    # release's included) for GitHub's default 6 hours; a slow runner took 31 min to build and was cancelled at 60 min (run 43744353898).
    timeout-minutes: 60
    outputs:
      clean: ${{ steps.seed.outputs.clean || 'true' }}   # true when the Seed step was skipped (release mode, kit/*, clean_build)
      seed_id: ${{ steps.up.outputs.artifact-id }}   # the .build of this run: next runs' seed, and what test/render unpack
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}  # empty outside release mode: the event's own commit
      - name: Release pin
        if: inputs.release_sha != '' || inputs.release_version != ''
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PIN_WORKFLOW: .github/workflows/windows.yml
        run: |
          # Release mode tests exactly release_sha. The steps below come from this workflow (the dispatched ref, GITHUB_SHA),
          # the files they run from the checkout (release_sha): the two must agree on the workflow and the toolchain action.
          fail() { echo "::error::Release pin: $1"; echo "FAIL release.pin: $1"; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "release_sha must be 40 lowercase hex characters, got '$RELEASE_SHA'"
          head=$(git rev-parse HEAD)
          [ "$head" = "$RELEASE_SHA" ] || fail "checked out $head, not release_sha $RELEASE_SHA"
          version=$(sed -nE 's/^VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' scripts/build-app.sh)
          [ -n "$RELEASE_VERSION" ] && [ "$version" = "$RELEASE_VERSION" ] || fail "scripts/build-app.sh at $RELEASE_SHA has VERSION=\"$version\", not release_version '$RELEASE_VERSION'"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          rc=0; git diff --quiet "$GITHUB_SHA" "$RELEASE_SHA" -- "$PIN_WORKFLOW" .github/actions/windows-swift || rc=$?
          if [ "$rc" -eq 1 ]; then
              git diff --stat "$GITHUB_SHA" "$RELEASE_SHA" -- "$PIN_WORKFLOW" .github/actions/windows-swift
              fail "main moved and changed the workflow; start the release again"
          fi
          [ "$rc" -eq 0 ] || fail "git diff $GITHUB_SHA $RELEASE_SHA failed ($rc)"
          line="PASS release.pin: testing $RELEASE_SHA as v$RELEASE_VERSION; $PIN_WORKFLOW and .github/actions/windows-swift identical at the dispatched $GITHUB_SHA"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/windows-swift
        id: swift1
        continue-on-error: true
        timeout-minutes: 12   # the install takes about 1.4 min, a slow swift.org download 8 min (seen three times on 2026-11-17); a hung one held a run for 31 min
      - uses: ./.github/actions/windows-swift
        if: steps.swift1.outcome != 'success'
        timeout-minutes: 12   # the one retry
      - name: Seed (the .build of an earlier run; not in release mode, on kit/* branches or with clean_build)
        id: seed
        if: inputs.release_sha == '' && !inputs.clean_build && !startsWith(github.ref, 'refs/heads/kit/') && !startsWith(github.head_ref, 'kit/')
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows/seed-restore.ps1 -Workflow windows.yml -Artifact ptb-seed-debug -Branch '${{ inputs.seed_trunk || 'windows-port' }}'
      - name: Build (compiles every target and the tests; compile errors stop the run here)
        timeout-minutes: 45
        shell: bash
        run: |
          mapfile -t extra < <(pwsh -NoProfile -File ./scripts/windows/swift-build-args.ps1 | tr -d '\r')
          swift build --build-tests "${extra[@]}" 2>&1 | tee build.log
      - name: Test shards (every test class in exactly one of four shards)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $extra = @(./scripts/windows/swift-build-args.ps1)
          swift test --skip-build @extra list 2>&1 | Tee-Object -FilePath tests.txt | Select-Object -Last 3
          ./scripts/windows/test-shards.ps1 -List tests.txt -Shards 4 -Out shards
      - name: Pack .build as the seed
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/windows/seed-save.ps1 -Clean '${{ steps.seed.outputs.clean || 'true' }}'
      - uses: actions/upload-artifact@v4
        id: up
        with:
          # A pull_request run uploads the build only to hand it to its own shards (1 day, another name: the seed search never reads it
          # and is restricted to push/dispatch runs anyway); only push and dispatch runs leave a seed for later runs.
          name: ${{ github.event_name == 'pull_request' && 'ptb-handoff-debug' || 'ptb-seed-debug' }}
          overwrite: true
          path: seed-out
          compression-level: 0   # the tar is zstd already
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 3 }}
      - uses: actions/upload-artifact@v4
        with:
          name: ptb-test-shards
          overwrite: true
          path: shards
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-logs
          overwrite: true
          path: |
            build.log
            tests.txt
          retention-days: 7
          if-no-files-found: warn
  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
      - uses: ./.github/actions/windows-swift
        id: swift1
        continue-on-error: true
        timeout-minutes: 12   # the install takes about 1.4 min, a slow swift.org download 8 min (seen three times on 2026-11-17); a hung one held a run for 31 min
      - uses: ./.github/actions/windows-swift
        if: steps.swift1.outcome != 'success'
        timeout-minutes: 12   # the one retry
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.seed_id }}
          merge-multiple: true
          path: seed-in
      - uses: actions/download-artifact@v4
        with:
          name: ptb-test-shards
          path: shards
      - name: Unpack the build of this run
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/windows/restore-mtimes.ps1
          ./scripts/windows/build-seed.ps1 -Unpack seed-in/seed.tar.zst
      - name: Test (shard ${{ matrix.shard }} of 4)
        timeout-minutes: 40
        shell: bash
        env:
          # Where the bundled plaza art and fonts are in the checkout (the Windows build has no SwiftPM resources; a packaged
          # app finds them in Resources\Plaza instead). testBundledPlazaArtIsFoundOnWindows fails when they are not found.
          PTB_CANVAS_OUT: ${{ github.workspace }}\canvas-out
          PTB_PLAZA_RESOURCES: ${{ github.workspace }}\Sources\PokeTokenBar\Resources\Plaza;${{ github.workspace }}\windows\resources\Plaza
          # The plaza renderer's preview scenes (stage 6 Task 4): PNGs and tree dumps, uploaded as `plaza-preview-win`.
          PTB_PLAZA_PREVIEW_OUT: ${{ github.workspace }}\plaza-preview
          PTB_PLAZA_DEVICE: warp
          # The Windows photos of the eight harness photo scenes (stage 6 Task 12), uploaded as `plaza-photos-win`.
          PTB_PHOTO_OUT: ${{ github.workspace }}\photo-out
        run: |
          mapfile -t extra < <(pwsh -NoProfile -File ./scripts/windows/swift-build-args.ps1 | tr -d '\r')
          # The unsharded run had these folders created by whichever test ran first; testFetchedSpritesDrawInTheScene writes into the preview
          # folder without creating it (it relied on another class having run before it), so a shard creates them up front.
          mkdir -p plaza-preview photo-out canvas-out
          expected=$(tr -d '\r\n' < shards/shard-${{ matrix.shard }}.count)
          executed=0; skipped=0; failures=0; bad_exit=0; : > test.log
          echo "shard ${{ matrix.shard }}: $(ls shards/shard-${{ matrix.shard }}.*.filters | wc -l) chunks, $expected tests expected"
          # One swift test per chunk (a command line over ~32,000 characters fails on Windows, see scripts/windows/test-shards.ps1).
          set +e   # the shell runs with -e -o pipefail: a failing swift test must reach the exit-status bookkeeping below
          for chunk in shards/shard-${{ matrix.shard }}.*.filters; do
            args=(); while IFS= read -r f; do f=${f%$'\r'}; [ -n "$f" ] && args+=(--filter "$f"); done < "$chunk"
            swift test --skip-build "${extra[@]}" "${args[@]}" 2>&1 | tee -a test.log | tee chunk.log; rc=${PIPESTATUS[0]}
            [ "$rc" -ne 0 ] && { echo "::warning::swift test exited with $rc for $chunk"; bad_exit=$((bad_exit + 1)); }
            line=$(grep -aE "Executed [0-9]+ tests?, with " chunk.log | tail -1)
            re='Executed ([0-9]+) tests?, with (([0-9]+) tests? skipped and )?([0-9]+) failures? \(([0-9]+) unexpected\)'
            [[ "$line" =~ $re ]] || { echo "::error::no XCTest summary line for $chunk"; exit 1; }
            executed=$((executed + BASH_REMATCH[1])); skipped=$((skipped + ${BASH_REMATCH[3]:-0})); failures=$((failures + BASH_REMATCH[4]))
          done
          set -e
          echo "summary: executed $executed, skipped $skipped, failures $failures"
          mkdir -p shard-result
          printf '{ "shard": %d, "executed": %d, "skipped": %d, "failures": %d, "expected": %d }\n' ${{ matrix.shard }} "$executed" "$skipped" "$failures" "$expected" > shard-result/result.json
          cat shard-result/result.json
          if [ "$failures" -ne 0 ]; then echo "::error::shard ${{ matrix.shard }}: $failures failures"; exit 1; fi
          # xctest can print a clean summary and still die on exit, or SwiftPM can report a signal: a non-zero exit of any chunk fails the shard.
          if [ "$bad_exit" -ne 0 ]; then echo "::error::shard ${{ matrix.shard }}: swift test exited non-zero in $bad_exit chunk(s)"; exit 1; fi
          if [ "$executed" -ne "$expected" ]; then echo "::error::shard ${{ matrix.shard }} executed $executed tests, its filters list $expected"; exit 1; fi
          # Outside the installed app the WinHTTP seam refuses real hosts (WinHTTPFetch.refuseRealNetworkOutsideTheApp), naming each
          # once on stderr: a test that needs such an answer fails on its own; the rest are fetches nobody waits for. Listed here.
          refused=$(grep -a "WinHTTPFetch: refused real host" test.log | sed 's/.*refused real host \([^ ]*\).*/\1/' | sort -u | tr '\n' ' ' || true)
          if [ -n "$refused" ]; then echo "::notice::real hosts refused outside the installed app: $refused"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-logs-${{ matrix.shard }}
          overwrite: true
          path: "*.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-result-${{ matrix.shard }}
          overwrite: true
          path: shard-result
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plaza-preview-win-${{ matrix.shard }}
          overwrite: true
          path: plaza-preview
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plaza-photos-win-${{ matrix.shard }}
          overwrite: true
          path: photo-out
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-renders-${{ matrix.shard }}
          overwrite: true
          path: canvas-out
          if-no-files-found: ignore
  # Stage 6 Task 15: the plaza render harness on Windows (every scene of the shared list through Direct2D on WARP) compared with the
  # Mac's committed render. It unpacks the build of this run (no second build); it fails when the Windows plaza draws something the
  # Mac does not (tree, pixels outside the text, see PlazaCrossCompare).
  render:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}  # release mode renders the pinned commit too (the pin itself is checked in `build`)
      - uses: ./.github/actions/windows-swift
        id: swift1
        continue-on-error: true
        timeout-minutes: 12   # the install takes about 1.4 min, a slow swift.org download 8 min (seen three times on 2026-11-17); a hung one held a run for 31 min
      - uses: ./.github/actions/windows-swift
        if: steps.swift1.outcome != 'success'
        timeout-minutes: 12   # the one retry
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.seed_id }}
          merge-multiple: true
          path: seed-in
      - name: Unpack the build of this run
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/windows/restore-mtimes.ps1
          ./scripts/windows/build-seed.ps1 -Unpack seed-in/seed.tar.zst
      - name: Extract the Mac reference
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir plaza-cross-ref
          tar -xzf Tests/PlazaCrossReference/mac-reference.tar.gz -C plaza-cross-ref
          echo "reference files: $(ls plaza-cross-ref | wc -l)"
      - name: Render and compare
        timeout-minutes: 40
        shell: bash
        env:
          PTB_PLAZA_RESOURCES: ${{ github.workspace }}\Sources\PokeTokenBar\Resources\Plaza;${{ github.workspace }}\windows\resources\Plaza
          PTB_PLAZA_CROSS_REF: ${{ github.workspace }}\plaza-cross-ref
          PTB_PLAZA_RENDER_OUT: ${{ github.workspace }}\plaza-render-out
          PTB_PLAZA_DEVICE: warp
        run: |
          set +e
          mkdir -p plaza-render-out
          start=$(date +%s)
          mapfile -t extra < <(pwsh -NoProfile -File ./scripts/windows/swift-build-args.ps1 | tr -d '\r')
          swift test --skip-build "${extra[@]}" --filter 'WindowsPlazaRenderHarnessTests|WindowsPlazaRendererTests/testFrameCostOnWARP' 2>&1 | tee plaza-render-out/render.log
          rc=${PIPESTATUS[0]}
          end=$(date +%s)
          echo "TIMING: render+compare $((end - start)) s" | tee -a plaza-render-out/render.log
          grep -E "^CROSS:|WINRENDER|FRAMECOST" plaza-render-out/render.log || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plaza-render-win
          overwrite: true
          path: plaza-render-out
          retention-days: 7
          if-no-files-found: warn
  # One conclusion for the run, and the guard that sharding lost nothing: the shards' executed counts add up to the listed total.
  result:
    needs: [build, test, render]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every job passed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = []
          for name, n in needs.items():
              print('%-8s %s' % (name, n['result']))
              if n['result'] != 'success': bad.append(name + '=' + n['result'])
          if bad:
              print('::error::windows: ' + ', '.join(bad)); sys.exit(1)
          print('PASS windows: build, test shards and render passed')
          "
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ptb-test-shards
          path: shards
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-result-*
          path: results
      - name: Tests per shard add up to the listed total
        id: sum
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CLEAN: ${{ needs.build.outputs.clean }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, sys
          # The executed-test floor has one source: MIN_EXECUTED in scripts/team_release.py (the release collector checks the same number).
          floor = int(re.search(r'^MIN_EXECUTED = (\d+)', open('scripts/team_release.py').read(), re.M).group(1))
          total = int(open('shards/total.txt').read())
          rows = [json.load(open(p)) for p in sorted(glob.glob('results/*/result.json'))]
          if len(rows) != 4:
              print('::error::%d shard results, expected 4' % len(rows)); sys.exit(1)
          executed = sum(r['executed'] for r in rows); skipped = sum(r['skipped'] for r in rows); failures = sum(r['failures'] for r in rows)
          for r in rows:
              print('shard %(shard)d: executed %(executed)d of %(expected)d expected, skipped %(skipped)d, failures %(failures)d' % r)
              if r['executed'] != r['expected']:
                  print('::error::shard %d executed %d tests, its filters list %d' % (r['shard'], r['executed'], r['expected'])); sys.exit(1)
          print('total listed %d, executed %d, skipped %d, failures %d' % (total, executed, skipped, failures))
          if executed != total or failures != 0 or executed < floor:
              print('::error::executed=%d listed=%d floor=%d failures=%d: sharding lost or doubled a test, a test failed, or too few tests ran' % (executed, total, floor, failures)); sys.exit(1)
          if os.environ.get('RELEASE_SHA'):
              os.makedirs('windows-tests', exist_ok=True)
              doc = {'schema': 1, 'sha': os.environ['RELEASE_SHA'], 'version': os.environ['RELEASE_VERSION'], 'executed': executed,
                     'skipped': skipped, 'failures': failures, 'cleanBuild': os.environ.get('CLEAN') == 'true'}
              json.dump(doc, open('windows-tests/windows-tests.json', 'w')); print(json.dumps(doc))
              print('PASS release.tests: executed=%d skipped=%d failures=%d cleanBuild=%s for %s' % (executed, skipped, failures, doc['cleanBuild'], os.environ['RELEASE_SHA']))
          EOF
      # Release mode, last: only a run where every job above passed leaves windows-tests.
      - uses: actions/upload-artifact@v4
        if: success() && inputs.release_sha != ''
        with:
          overwrite: true   # a re-run replaces the first attempt's artifact: a by-name download is the current attempt's
          name: windows-tests
          path: windows-tests/
          retention-days: 7
          if-no-files-found: error
