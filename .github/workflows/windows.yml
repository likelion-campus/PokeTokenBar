name: windows
# Builds and tests the shared (non-Apple) part of the app on Windows. Informational: not a required check.
on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/windows-swift
      - name: Build
        shell: bash
        run: swift build 2>&1 | tee build.log
      - name: Test
        shell: bash
        run: |
          swift test 2>&1 | tee test.log
          # Second net: a runner that dies at discovery reports "0 tests" and used to look like a pass.
          n=$(grep -oE "Executed [0-9]+ tests" test.log | tail -1 | grep -oE "[0-9]+" || echo 0)
          echo "Executed $n tests"
          if [ "$n" -lt 2000 ]; then echo "::error::only $n tests ran (expected at least 2000)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-logs
          path: "*.log"
