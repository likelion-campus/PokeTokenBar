name: windows-pc-probe
# Temporary diagnostic (this branch only): notification and language facts of the runner.
on:
  push:
    branches: [fix/windows-language-and-balloons]
    paths: ['scripts/windows/probe-notifications.ps1', '.github/workflows/windows-pc-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: As provisioned
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/probe-notifications.ps1 -OutDir probe-default
      - name: Toasts enabled for the test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/probe-notifications.ps1 -OutDir probe-enabled -Enable
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: probe-* }
