name: spike-windows
# Throwaway experiments for the Windows port (spec §9). Never merged to main.
on:
  push:
    branches: ['spike/**']
concurrency:
  group: spike-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, branch: swift-6.1.2-release, tag: 6.1.2-RELEASE }
          - { os: windows-latest, branch: swift-6.3.2-release, tag: 6.3.2-RELEASE }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: ${{ matrix.branch }}
          tag: ${{ matrix.tag }}
      - run: swift --version
      - name: Portable closure - build and test
        shell: bash
        run: |
          cd spike/core
          cp closure-sources.txt sources.txt; cp closure-tests.txt tests.txt; ./sync.sh
          swift build 2>&1 | tee closure-build.log
          swift test 2>&1 | tee closure-test.log
      - name: Wide set - build, errors expected
        if: always()
        shell: bash
        run: |
          cd spike/core
          cp wide-sources.txt sources.txt; : > tests.txt; ./sync.sh
          swift build 2>&1 > wide-build.log || true
          grep -E "error:" wide-build.log | sed -E 's/^.*error: //' | sort | uniq -c | sort -rn > wide-errors.txt
          head -60 wide-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-log-${{ matrix.os }}
          path: spike/core/*.log
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: OpenSSL (static)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static
      - name: Build
        shell: cmd
        run: |
          cd spike\probe
          cl /nologo /W3 /MT /O1 ptbprobe.c /I "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\include" /link /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib" libssl.lib libcrypto.lib ws2_32.lib dnsapi.lib crypt32.lib advapi32.lib user32.lib
          dir ptbprobe.exe
      - name: Loopback run (APIs only, not the answer)
        shell: bash
        run: |
          cd spike/probe
          ./ptbprobe.exe serve CITEST --once > serve.log 2>&1 &
          sleep 3
          ./ptbprobe.exe browse CITEST --once > browse.log 2>&1 || true
          sleep 2
          echo "--- serve"; cat serve.log; echo "--- browse"; cat browse.log
          echo "--- direct"; port=$(grep -oE "LISTENING port [0-9]+" serve.log | grep -oE "[0-9]+$" || true)
          ./ptbprobe.exe serve CITEST --once > serve2.log 2>&1 &
          sleep 2; port=$(grep -oE "LISTENING port [0-9]+" serve2.log | grep -oE "[0-9]+$")
          ./ptbprobe.exe browse CITEST --host 127.0.0.1 --port "$port" --once; cat serve2.log
      - uses: actions/upload-artifact@v4
        with:
          name: ptbprobe-win-x64
          path: spike/probe/ptbprobe.exe
  draw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.2-release
          tag: 6.3.2-RELEASE
      - name: Build
        shell: bash
        run: cd spike/draw && swift build -c release 2>&1 | tail -40
      - name: Render headless
        shell: bash
        run: |
          mkdir res && cp Sources/PokeTokenBar/Resources/Plaza/*.png Sources/PokeTokenBar/Resources/Plaza/*.ttf res/
          curl -sSL -o res/Pretendard-Bold.otf "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/public/static/Pretendard-Bold.otf"
          spike/draw/.build/release/ptbdraw.exe res draw-warp.png
          ls -la draw-warp.png spike/draw/.build/release/ptbdraw.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-png
          path: draw-warp.png
