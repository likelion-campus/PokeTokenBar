name: Usage sheet

on:
  pull_request:
    paths:
      - "tools/usage-sheet/**"
      - "Sources/PokeTokenBar/Core/Local*UsageProvider.swift"
      - ".github/workflows/usage-sheet.yml"
  push:
    branches: [main]
    paths:
      - "tools/usage-sheet/**"
      - "Sources/PokeTokenBar/Core/Local*UsageProvider.swift"
      - ".github/workflows/usage-sheet.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      - name: Build, check dist, test
        run: node tools/usage-sheet/build.js && git diff --exit-code tools/usage-sheet/dist/Code.gs && node --test tools/usage-sheet/test/
