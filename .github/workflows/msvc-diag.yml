name: msvc-diag
on:
  push:
    branches: [ci/windows-msvc-toolset-pin]
    paths: ['.github/workflows/msvc-diag.yml']
jobs:
  d:
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - shell: pwsh
        run: |
          "image $env:ImageVersion"
          $vw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vw -all -products * -property installationPath
          & $vw -all -products * -property catalog_productDisplayVersion
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Directory | ForEach-Object { $_.FullName; Get-ChildItem (Join-Path $_.FullName '*\VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue | ForEach-Object { '  toolset ' + $_.FullName } }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | ForEach-Object Name
