name: msvc-diag
on:
  push:
    branches: [ci/windows-msvc-toolset-pin]
    paths: ['.github/workflows/msvc-diag.yml']
jobs:
  d:
    strategy:
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - shell: pwsh
        run: |
          "image $env:ImageVersion"
          $vw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vw -all -products * -property installationPath
          & $vw -all -products * -property catalog_productDisplayVersion
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*' -Directory | ForEach-Object { 'TOOLSET ' + $_.FullName }
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\include\yvals_core.h' | ForEach-Object { 'YVALS ' + $_.FullName; Select-String -Path $_.FullName -Pattern '_MSVC_STL_VERSION|STL1000|_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH|_MSC_VER >=|__clang_major__' | Select-Object -First 12 | ForEach-Object { '   ' + $_.Line.Trim() } }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | ForEach-Object Name
