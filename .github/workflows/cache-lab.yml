name: cache-lab
# Proof lab for the incremental Windows builds (a CI tool, not part of the product), run by hand. It packs .build after a cold build,
# restores it on a fresh checkout with the same stamping a seeded CI build uses and changes one thing at a time (Swift leaf and widely used
# files, an interface change, C++, C headers, a new header and its user, mac-only.txt on a fresh runner, Package.swift, a deleted file, the
# release .res), checking the linked exe or the test list rather than the log. See cache-lab-flavor.yml and docs/reference/windows-ci-build-seed.md.
# Run after a Swift or runner-image upgrade: gh workflow run cache-lab.yml --ref <branch> (a workflow file is dispatchable once it is on main).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    uses: ./.github/workflows/cache-lab-flavor.yml
    with:
      flavor: debug
  release:
    uses: ./.github/workflows/cache-lab-flavor.yml
    with:
      flavor: release
