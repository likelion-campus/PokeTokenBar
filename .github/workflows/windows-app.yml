name: windows-app
# Two levels (job env PTB_LEVEL, shown in the job summary):
#   light - build, bundle selftests (incl. stripped Path, crash, team transports, UI dump), package, installer build,
#           silent install + installed selftest (proves the DLL closure), artifacts. No upgrade test, no idle gate,
#           no uninstall check, no dispatch-loop fallback selftest.
#   full  - light + the dispatch-loop fallback selftest, the upgrade test, the idle gate and the uninstall check.
# Every run on windows-port (push or dispatch) is full. Any other ref is light unless dispatched with `-f level=full`:
#   gh workflow run windows-app.yml --ref <branch> -f level=full --repo likelion-campus/PokeTokenBar
# The three wake-up diagnostics (Waker hunt, Timeline, Waker modes) run only with `-f diagnostics=true`, at any level.
# A new push cancels the running workflow of a work branch; on windows-port a running run finishes and one is queued.
# main (after the merge) runs light on every push.
# Release mode (stage 8; scripts/team_release.py dispatches it): -f release_sha=<40 hex> -f release_version=<x.y.z>.
#   Builds exactly that commit at level full, with diagnostics, fast, stall_hunt and net_burst forced off. The "Release pin"
#   step fails unless the commit carries that VERSION and this workflow and .github/actions/windows-swift are identical at the
#   commit and at the dispatched ref. Its own concurrency group is never cancelled. A run that passed every gate ends with
#   the artifact windows-release (the installer and windows-release.json, 7 days). CI never touches a release.
# Builds and self-tests the Windows app executable. Informational: not a required check.
run-name: ${{ inputs.release_sha != '' && format('release {0} {1}', inputs.release_version, inputs.release_sha) || '' }}
on:
  push:
    branches: [windows-port, main]
  pull_request:
    paths:
      - 'Sources/PokeTokenBar/Platform/**'
      - 'Sources/CWinShim/**'
      - 'Sources/CTeamTLS/**'
      - 'Sources/PokeTokenBarWin/**'
      - 'Tests/PokeTokenBarTests/Windows*'
      - 'Package.swift'
      - 'windows/**'
      - 'scripts/windows/**'
      - 'installer/**'
      - 'assets/AppIcon.ico'
      - '.github/workflows/windows-app.yml'
      - '.github/actions/windows-swift/**'
  workflow_dispatch:
    inputs:
      level:
        description: 'light (default; build, selftests, installer) or full (adds upgrade test, idle gate, uninstall). windows-port is always full'
        type: choice
        options: [light, full]
        default: light
      diagnostics:
        description: 'Also run the three wake-up diagnostic steps (slow)'
        type: boolean
        default: false
      fast:
        description: 'Skip the long idle gate and the waker hunt (true/false)'
        default: 'false'
      stall_hunt:
        description: 'Extra selftest launches that report main-thread stalls (diagnostics; 0 = none)'
        default: '0'
      net_burst:
        description: 'Also run the network-burst helper: what one HTTP fetch costs in wakeups (diagnostics, ~4 min)'
        type: boolean
        default: false
      release_sha:
        description: 'Release mode: the 40-hex commit to build (set by team_release.py)'
        default: ''
      release_version:
        description: 'Release mode: the x.y.z that commit carries in scripts/build-app.sh'
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ inputs.release_sha != '' && format('windows-app-release-{0}', inputs.release_sha) || format('windows-app-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.release_sha == '' && github.ref != 'refs/heads/windows-port' }}
jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PTB_LEVEL: ${{ (github.ref == 'refs/heads/windows-port' || inputs.level == 'full' || inputs.release_sha != '') && 'full' || 'light' }}
      # The switches that skip or add steps, as this run uses them: release mode forces them off (the idle gate always runs).
      PTB_DIAGNOSTICS: ${{ inputs.release_sha == '' && inputs.diagnostics == true }}
      PTB_FAST: ${{ inputs.release_sha == '' && inputs.fast == 'true' }}
      PTB_STALL_HUNT: ${{ inputs.release_sha == '' && inputs.stall_hunt || '0' }}
      PTB_NET_BURST: ${{ inputs.release_sha == '' && inputs.net_burst == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}  # empty outside release mode: the event's own commit
      - name: Release pin
        if: inputs.release_sha != '' || inputs.release_version != ''
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PIN_WORKFLOW: .github/workflows/windows-app.yml
        run: |
          # Release mode builds exactly release_sha. The steps below come from this workflow (the dispatched ref, GITHUB_SHA),
          # the files they run from the checkout (release_sha): the two must agree on the workflow and the toolchain action.
          fail() { echo "::error::Release pin: $1"; echo "FAIL release.pin: $1"; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "release_sha must be 40 lowercase hex characters, got '$RELEASE_SHA'"
          head=$(git rev-parse HEAD)
          [ "$head" = "$RELEASE_SHA" ] || fail "checked out $head, not release_sha $RELEASE_SHA"
          version=$(sed -nE 's/^VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' scripts/build-app.sh)
          [ -n "$RELEASE_VERSION" ] && [ "$version" = "$RELEASE_VERSION" ] || fail "scripts/build-app.sh at $RELEASE_SHA has VERSION=\"$version\", not release_version '$RELEASE_VERSION'"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          rc=0; git diff --quiet "$GITHUB_SHA" "$RELEASE_SHA" -- "$PIN_WORKFLOW" .github/actions/windows-swift || rc=$?
          if [ "$rc" -eq 1 ]; then
              git diff --stat "$GITHUB_SHA" "$RELEASE_SHA" -- "$PIN_WORKFLOW" .github/actions/windows-swift
              fail "main moved and changed the workflow; start the release again"
          fi
          [ "$rc" -eq 0 ] || fail "git diff $GITHUB_SHA $RELEASE_SHA failed ($rc)"
          line="PASS release.pin: building $RELEASE_SHA as v$RELEASE_VERSION; $PIN_WORKFLOW and .github/actions/windows-swift identical at the dispatched $GITHUB_SHA"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - name: Level of this run (job summary)
        shell: pwsh
        run: |
          $lines = @("## windows-app: level **$env:PTB_LEVEL**", '')
          if ($env:PTB_LEVEL -eq 'full') {
              $lines += 'Ran: everything, including the upgrade test, the idle gate and the uninstall check.'
          } else {
              $lines += '**Light run, not a full one.** Skipped step groups: dispatch-loop fallback selftest, upgrade test, idle gate, uninstall check.'
              $lines += 'Ask for the full run with `gh workflow run windows-app.yml --ref <branch> -f level=full`.'
          }
          $lines += ('Diagnostics (waker hunt, timeline, waker modes): ' + $(if ($env:PTB_DIAGNOSTICS -eq 'true') { 'ran' } else { 'skipped (`-f diagnostics=true` to run)' }))
          if ('${{ inputs.release_sha }}') { $lines += "Release mode: level full; diagnostics, fast, stall_hunt and net_burst forced off (diagnostics=$env:PTB_DIAGNOSTICS fast=$env:PTB_FAST stall_hunt=$env:PTB_STALL_HUNT net_burst=$env:PTB_NET_BURST)." }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines
      - uses: ./.github/actions/windows-swift
      - name: Resources (version info, icon, manifest)
        id: resources
        shell: pwsh
        run: |
          $res = ./scripts/windows/build-resources.ps1 -Out resources | Select-Object -Last 1
          "PTB_RES=$($res -replace '\\', '/')" >> $env:GITHUB_ENV
      - name: Build
        shell: bash
        run: swift build -c release --product PokeTokenBarWin -Xlinker "$PTB_RES" 2>&1 | tee build.log
      - name: Package
        id: package
        shell: pwsh
        run: |
          ./scripts/windows/package.ps1 -Out bundle 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PTB_VERSION=$((Get-Content bundle\PokeTokenBar.version -Raw).Trim())" >> $env:GITHUB_ENV
      - name: Selftest fixture
        shell: pwsh
        run: |
          # Claude Code logs dated "today", so the store's refresh has a known total; a fresh state folder.
          $fx = Join-Path $env:RUNNER_TEMP 'ptb-selftest'
          $proj = Join-Path $fx 'claude\projects\p'
          New-Item -ItemType Directory -Force -Path $proj, (Join-Path $fx 'state'), (Join-Path $fx 'state-dispatch') | Out-Null
          $ts = (Get-Date).ToUniversalTime().AddSeconds(-30).ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          (Get-Content 'windows\selftest\claude\projects\p\s.jsonl' -Raw).Replace('__TIMESTAMP__', $ts) |
            Set-Content -NoNewline -Encoding utf8NoBOM -Path (Join-Path $proj 's.jsonl')
          "PTB_FIXTURE=$fx" >> $env:GITHUB_ENV
      - name: Visual C++ redistribution terms on this image (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          # Which licence files sit next to the redistributable the bundle copies (names only; the notice file cites them).
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          "VS: $vs ($(& $vswhere -latest -products * -property catalog_productDisplayVersion))"
          Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory | ForEach-Object { "redist dir: $($_.Name)"; Get-ChildItem $_.FullName -File | ForEach-Object { "  file: $($_.Name) $($_.Length)" } }
          $places = @($vs, (Join-Path $vs 'Licenses'), (Join-Path $vs 'VC'), (Join-Path $vs 'VC\Redist'), (Join-Path $vs 'VC\Redist\MSVC')) | Where-Object { Test-Path $_ }
          $terms = foreach ($p in $places) { Get-ChildItem $p -File -Depth 2 -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)redist.*\.txt|license|eula' } }
          $terms | Sort-Object FullName -Unique | Select-Object -First 40 | ForEach-Object { "terms: $($_.FullName.Substring($vs.Length)) $($_.Length)" }
          $redist = $terms | Where-Object { $_.Name -match '(?i)^redist.*\.txt$' } | Select-Object -First 1
          if ($redist) { "---- $($redist.Name), first lines:"; Get-Content $redist.FullName -TotalCount 25 }
      - name: Network burst (what one HTTP fetch costs in wakeups, per thread; diagnostics)
        if: (success() || failure()) && steps.package.outcome == 'success' && env.PTB_NET_BURST == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-net-burst'
          New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
          $out = Join-Path $PWD 'net-burst.json'
          $p = Start-Process -FilePath bundle\PokeTokenBar.exe -ArgumentList '--selftest-net-burst', $out -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; 'the net-burst helper did not finish in 10 min' }
          "exit $($p.ExitCode)"
          if (-not (Test-Path $out)) { throw 'no net-burst.json' }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          $j.notes | ForEach-Object { "note: $_" }
          foreach ($r in $j.results) {
              "NETBURST {0}: req={1} ms busy={2} ms (+{3}..+{4}) hot_cs={5} ({6}/s) partner_cs={7} process_cs={8} tail_cs={9} cycles={10:N0} | {11}" -f `
                  $r.name, $r.requestMs, $r.busyMs, $r.busyStartMs, $r.busyEndMs, $r.hotCs, $r.hotWakesPerSec, $r.partnerCs, $r.processCs, $r.tailCs, $r.processCycles, $r.outcome
              "    hot=$($r.hot) | partner=$($r.partner)"
              "    top: $($r.top)"
          }
          foreach ($s in $j.stacks) { "== stacks $($s.name)"; $s.detail }
      - name: Selftest with a stripped Path
        id: bundle-selftest
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state'
          # The fixture's usage after (message.id, requestId) dedup: 1000+200+30+4 + 2000+400+60+8.
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          # OpenSSL must never read a config file (tls.noConfigFile): this one makes OpenSSL's init fail if it is loaded
          # (a provider that cannot load, with config_diagnostics on), and the team checks all run TLS.
          $conf = Join-Path $env:RUNNER_TEMP 'ptb-poison-openssl.cnf'
          Set-Content -Path $conf -Value @('config_diagnostics = 1', 'openssl_conf = ptb_poison', '[ptb_poison]',
              'providers = ptb_providers', '[ptb_providers]', 'ptbpoison = ptb_poison_provider', '[ptb_poison_provider]',
              'module = C:\ptb\no-such-provider.dll', 'activate = 1')
          $env:OPENSSL_CONF = $conf
          # TEST ONLY, runner profile only: the app never writes these (the balloon screenshot needs toasts switched on).
          $pn = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\PushNotifications'
          if (-not (Test-Path $pn)) { New-Item $pn | Out-Null }
          Set-ItemProperty $pn ToastEnabled 1 -Type DWord
          ./scripts/windows/run-selftest.ps1 -Exe bundle\PokeTokenBar.exe -Out st.json -ExpectStrategy cfRunLoopWithMessages -DumpUi (Join-Path $PWD 'ui-dump')
      # --- stage 7 Task 3: the popover kit (begin) ---
      - name: Popover kit checks ran (ui.kit.*, gallery in ui-dump/kit)
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $j = Get-Content st.json -Raw | ConvertFrom-Json
          $names = 'ui.kit.tabOrder', 'ui.kit.keys', 'ui.kit.text', 'ui.kit.typed', 'ui.kit.enterEscape', 'ui.kit.menuKeys', 'ui.kit.unregister',
                   'ui.kit.fonts', 'ui.kit.glyphs', 'ui.kit.drawn', 'ui.kit.tooltips', 'ui.kit.scroll', 'ui.kit.dpi', 'ui.kit.idle', 'ui.kit.capture', 'ui.kit.openClose3'
          $bad = @()
          foreach ($n in $names) {
              $c = $j.checks | Where-Object { $_.name -eq $n }
              if (-not $c) { $bad += "$n missing" } elseif (-not $c.ok) { $bad += "$n FAIL" } elseif ($c.detail -like 'skipped*') { $bad += "$n skipped on CI" }
              else { "PASS ${n}" }
          }
          Get-ChildItem ui-dump\kit -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
          if ($bad.Count -gt 0) { throw "popover kit: $($bad -join ', ')" }
      # --- stage 7 Task 3: the popover kit (end) ---
      # --- stage 7 Task 4: the popover window (begin) ---
      - name: Popover window checks ran (popover.*, captures in ui-dump/popover)
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $j = Get-Content st.json -Raw | ConvertFrom-Json
          $names = 'popover.open', 'popover.placement', 'popover.toggle', 'popover.dismissOnActivate', 'popover.dismissInput', 'popover.escape',
                   'popover.closePaths', 'popover.ownedKeepsOpen', 'popover.staleCompletion', 'popover.dpiChange', 'popover.noSelfOpen',
                   'popover.refusedForeground', 'popover.menuAfter', 'popover.menuSettings', 'popover.secondLaunch', 'popover.realClick',
                   'popover.openClose3', 'popover.capture', 'popover.withPlaza'
          $bad = @()
          foreach ($n in $names) {
              $c = $j.checks | Where-Object { $_.name -eq $n }
              if (-not $c) { $bad += "$n missing" } elseif (-not $c.ok) { $bad += "$n FAIL" } elseif ($c.detail -like 'skipped*') { $bad += "$n skipped on CI" }
              else { "PASS ${n}: $($c.detail)" }
          }
          Get-ChildItem ui-dump\popover -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
          if ($bad.Count -gt 0) { throw "popover window: $($bad -join ', ')" }
      # --- stage 7 Task 4: the popover window (end) ---
      - name: Language and time zone in child processes (Korean display language, Seoul time zone)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: ./scripts/windows/check-language.ps1 -Exe bundle\PokeTokenBar.exe -OutDir lang-probe
      - name: Selftest on the dispatch-handle loop (diagnostic fallback, informational)
        if: (success() || failure()) && steps.package.outcome == 'success' && env.PTB_LEVEL == 'full'  # independent evidence, also after a selftest failure
        continue-on-error: true
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-dispatch'
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          $env:PTB_WIN_LOOP = 'dispatch'
          $env:PTB_SELFTEST_IDLE_SECONDS = '20'
          ./scripts/windows/run-selftest.ps1 -Exe bundle\PokeTokenBar.exe -Out st-dispatch.json -ExpectStrategy dispatchHandle
      - name: Kill and exit paths of the full app
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: |
          # The app writes team.memberID at launch and saves it right after the stores are built. Kill it
          # (TerminateProcess), start it again: the same memberID must come back. Then WM_CLOSE and
          # WM_ENDSESSION must each end it through WindowsApp.exit with exit code 0.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PtbWin {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
              [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint msg, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern IntPtr SendMessageTimeoutW(IntPtr h, uint msg, IntPtr w, IntPtr l, uint flags, uint timeout, out IntPtr result);
          }
          '@
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $plist = Join-Path $env:LOCALAPPDATA 'PokeTokenBar.exe.plist'
          $title = 'Local\PokeTokenBar-Team'
          function MemberId {
              if (-not (Test-Path $plist)) { return $null }
              $m = [regex]::Match((Get-Content $plist -Raw), '<key>team\.memberID</key>\s*<string>([^<]+)</string>')
              if ($m.Success) { return $m.Groups[1].Value } else { return $null }
          }
          function Start-App {
              $p = Start-Process -FilePath $exe -PassThru
              $null = $p.Handle
              for ($i = 0; $i -lt 150; $i++) {
                  $h = [PtbWin]::FindWindowW('PokeTokenBarSink', $title)
                  if ($h -ne [IntPtr]::Zero) { return @($p, $h) }
                  Start-Sleep -Milliseconds 200
              }
              throw 'the app made no sink window in 30 s'
          }
          "memberID before the first start: $(MemberId)"
          $p, $h = Start-App
          Start-Sleep -Seconds 2
          $first = MemberId
          Stop-Process -Id $p.Id -Force
          $null = $p.WaitForExit(10000)
          "killed (exit $($p.ExitCode)): memberID on disk = $first"
          if (-not $first) { throw 'team.memberID was not on disk 2 s after launch' }
          $p, $h = Start-App
          Start-Sleep -Seconds 2
          $second = MemberId
          "restarted: memberID on disk = $second"
          if ($second -ne $first) { throw "memberID changed across the kill: $first -> $second" }
          $null = [PtbWin]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE
          if (-not $p.WaitForExit(15000)) { throw 'WM_CLOSE did not end the app' }
          "WM_CLOSE: exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WM_CLOSE: exit code $($p.ExitCode)" }
          $p, $h = Start-App
          Start-Sleep -Seconds 1
          $reply = [IntPtr]::Zero
          $null = [PtbWin]::SendMessageTimeoutW($h, 0x0016, [IntPtr]1, [IntPtr]::Zero, 0, 5000, [ref]$reply)  # WM_ENDSESSION(TRUE)
          if (-not $p.WaitForExit(15000)) { throw 'WM_ENDSESSION did not end the app' }
          "WM_ENDSESSION: exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WM_ENDSESSION: exit code $($p.ExitCode)" }
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log') -Raw
          foreach ($reason in 'closeRequest', 'endSession') {
              if ($log -notmatch "exit code=0 reason=$reason") { throw "no 'reason=$reason' exit line in the log" }
          }
          'log has both exit lines'
      - name: Two-transport selftest (team probes over DNS-SD and TLS-PSK)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: |
          # Two --team-probe processes with one code find each other by real DNS-SD on this runner, link over TLS-PSK and
          # join as teammates (hello, presence); a third with another code must fail every handshake, deliver nothing and
          # wait out the 60 s cooldown (one dial per name). Codes go in on stdin only and must appear in no output.
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
          function New-Code { -join (1..12 | ForEach-Object { $alphabet[(Get-Random -Maximum 32)] }) }
          $code = New-Code; $other = New-Code
          Set-Content -NoNewline -Path probe-code.txt -Value "PTB-$($code.Substring(0,4))-$($code.Substring(4,4))-$($code.Substring(8,4))"
          Set-Content -NoNewline -Path probe-other.txt -Value $other.ToLower()
          function Start-Probe($name, $codeFile, $seconds) {
              $p = Start-Process -FilePath $exe -PassThru -RedirectStandardInput $codeFile -RedirectStandardOutput "probe-$name.out" `
                  -ArgumentList @('--team-probe', '--code-stdin', '--seconds', "$seconds", '--selftest-out', (Join-Path $PWD "probe-$name.txt"))
              $null = $p.Handle
              return $p
          }
          $a = Start-Probe 'a' probe-code.txt 30
          $b = Start-Probe 'b' probe-code.txt 30
          $c = Start-Probe 'c' probe-other.txt 25
          foreach ($p in $a, $b, $c) { if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; "probe $($p.Id) timed out" } }
          $fail = @()
          foreach ($n in 'a', 'b', 'c') {
              "----- probe $n (exit $((Get-Variable $n).Value.ExitCode)) -----"
              $text = Get-Content "probe-$n.txt" -Raw
              $text
              if ($text -match $code -or $text -match $other -or $text -match $other.ToLower()) { $fail += "probe $n printed a team code" }
              if ((Get-Content "probe-$n.out" -Raw) -match $code) { $fail += "probe $n stdout has the code" }
          }
          foreach ($n in 'a', 'b') {
              $text = Get-Content "probe-$n.txt" -Raw
              if ($text -notmatch 'RESULT PASS') { $fail += "probe $n did not pass" }
              if ($text -notmatch 'READY peer=\S+ dir=\S+ tls=TLSv1\.2 cipher=PSK-AES128-GCM-SHA256') { $fail += "probe ${n}: no TLSv1.2 PSK-AES128-GCM-SHA256 link" }
              if ($text -notmatch 'MSG peer=\S+ kind=hello') { $fail += "probe ${n}: no hello received" }
          }
          if ($a.ExitCode -ne 0 -or $b.ExitCode -ne 0) { $fail += "probe exit codes a=$($a.ExitCode) b=$($b.ExitCode)" }
          $ctext = Get-Content probe-c.txt -Raw
          if ($c.ExitCode -ne 1 -or $ctext -notmatch 'RESULT FAIL teammates=0') { $fail += 'the wrong-code probe joined or did not end with RESULT FAIL' }
          if ($ctext -notmatch 'messages=0 ') { $fail += 'the wrong-code probe received a message' }
          if ($ctext -notmatch 'handshake_failures=[1-9]') { $fail += 'the wrong-code probe saw no handshake failure' }
          if ($ctext -notmatch 'dials_per_name_max=1 ') { $fail += 'the wrong-code probe dialled a name twice inside the cooldown' }
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log') -Raw
          if ($log -match $code -or $log -match $other) { $fail += 'the app log has a team code' }
          if ($fail.Count -gt 0) { $fail | ForEach-Object { "FAIL team.twoProcesses: $_" }; exit 1 }
          'PASS team.twoProcesses: a and b linked and joined over TLSv1.2 PSK-AES128-GCM-SHA256; c (other code) refused, no message, one dial per name; no code in any output'
      - name: Team DNS-SD removal and aging (three probes, one killed, one exiting cleanly)
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          # a browses for 200 s. b is killed hard (TerminateProcess) after 15 s: what Windows' DNS-SD then reports, and
          # whether a forgets b's name (3 dials that find nothing, no answer in between) and stops dialling it. c exits
          # cleanly after 25 s: its goodbye must reach a within 1 s.
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
          $code = -join (1..12 | ForEach-Object { $alphabet[(Get-Random -Maximum 32)] })
          Set-Content -NoNewline -Path aging-code.txt -Value "PTB-$code"
          function Start-Probe($name, $seconds) {
              $p = Start-Process -FilePath $exe -PassThru -RedirectStandardInput aging-code.txt -RedirectStandardOutput "probe-$name.out" `
                  -ArgumentList @('--team-probe', '--code-stdin', '--seconds', "$seconds", '--selftest-out', (Join-Path $PWD "probe-$name.txt"))
              $null = $p.Handle
              return $p
          }
          $a = Start-Probe 'aging-a' 200
          Start-Sleep -Seconds 3
          $b = Start-Probe 'aging-b' 200
          $c = Start-Probe 'aging-c' 25
          Start-Sleep -Seconds 15
          Stop-Process -Id $b.Id -Force
          $killedAt = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          foreach ($p in $a, $c) { if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; "probe $($p.Id) timed out" } }
          $at = Get-Content probe-aging-a.txt -Raw; $bt = Get-Content probe-aging-b.txt -Raw; $ct = Get-Content probe-aging-c.txt -Raw
          foreach ($n in 'a', 'b', 'c') { "----- probe aging-$n -----"; Get-Content "probe-aging-$n.txt" }
          $bName = [regex]::Match($bt, 'ADVERTISE name=(\S+)').Groups[1].Value
          $cName = [regex]::Match($ct, 'ADVERTISE name=(\S+)').Groups[1].Value
          $goodbye = [regex]::Match($ct, 'GOODBYE dns_sd=(\S+).*at_ms=(\d+)')
          $fail = @()
          # c: clean exit
          $cLost = [regex]::Match($at, "LOST name=$cName at_ms=(\d+)")
          if (-not $goodbye.Success) { $fail += 'c printed no GOODBYE line' }
          elseif (-not $cLost.Success) { $fail += "a never saw c ($cName) removed" }
          else {
              $lag = [int64]$cLost.Groups[1].Value - [int64]$goodbye.Groups[2].Value
              "c ($cName): goodbye=$($goodbye.Groups[1].Value) at $($goodbye.Groups[2].Value); a saw LOST $lag ms later"
              if ($lag -gt 1000) { $fail += "a saw c's removal $lag ms after its goodbye (more than 1 s)" }
          }
          # b: killed
          $bLost = [regex]::Match($at, "LOST name=$bName at_ms=(\d+)")
          $bForgot = [regex]::Match($at, "FORGOTTEN name=$bName")
          $bAnswers = [regex]::Matches($at, "ANSWER name=$bName ttl=(\d+)[^\n]*at_ms=(\d+)") | ForEach-Object { "ttl=$($_.Groups[1].Value)@+$([int64]$_.Groups[2].Value - $killedAt)ms" }
          "b ($bName) killed at $killedAt; answers seen by a (TTL @ ms after the kill; negative = before): $($bAnswers -join ', ')"
          if ($bLost.Success) { "WINDNS: a saw LOST for the killed b $([int64]$bLost.Groups[1].Value - $killedAt) ms after the kill" }
          else { 'WINDNS: no LOST for the killed b within the run (no goodbye: the name stays until something drops it)' }
          if ($bForgot.Success) {
              'AGING: a forgot b: ' + ([regex]::Match($at, "\[\+[0-9.]+s\] FORGOTTEN name=$bName[^\n]*").Value)
              $after = $at.Substring($bForgot.Index)
              $later = [regex]::Matches($after, "(DIAL peer=\S+ to=$bName|RESOLVED name=$bName)").Count
              "AGING: dials or resolves of b after it was forgotten: $later"
              if ($later -gt 0) { $fail += 'a kept dialling b after forgetting it' }
          }
          if (-not $bLost.Success -and -not $bForgot.Success) { $fail += "a neither saw b removed nor forgot it within 200 s" }
          $dialsB = [regex]::Matches($at, "DIAL peer=\S+ to=$bName").Count
          "AGING: a dialled b $dialsB times in total"
          if ($fail.Count -gt 0) { $fail | ForEach-Object { "FAIL team.removalAndAging: $_" }; exit 1 }
          'PASS team.removalAndAging: the clean exit was seen within 1 s; the killed teammate stopped costing dials'
      - name: Team code tool keeps the settings guard and the backup
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          # --set-team-code / --clear-team-code on the real settings file (CI only): the verified backup follows a clear
          # (no code left in it), and an unreadable settings file is restored from the backup before the code is written.
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $plist = Join-Path $env:LOCALAPPDATA 'PokeTokenBar.exe.plist'
          $bak = "$plist.bak"
          $alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
          $code = -join (1..12 | ForEach-Object { $alphabet[(Get-Random -Maximum 32)] })
          Set-Content -NoNewline -Path tool-code.txt -Value "PTB-$code"
          Set-Content -NoNewline -Path tool-empty.txt -Value ''
          function Tool($toolArgs, $stdin) {
              $p = Start-Process -FilePath $exe -ArgumentList $toolArgs -RedirectStandardInput $stdin -RedirectStandardOutput tool.out -PassThru -Wait
              "tool $($toolArgs -join ' '): exit $($p.ExitCode): $((Get-Content tool.out -Raw).Trim())"
              if ($p.ExitCode -ne 0) { throw "the tool failed: $($toolArgs -join ' ')" }
          }
          function Keys($path) { [regex]::Matches((Get-Content $path -Raw), '<key>([^<]+)</key>') | ForEach-Object { $_.Groups[1].Value } }
          function MemberId($path) { [regex]::Match((Get-Content $path -Raw), '<key>team\.memberID</key>\s*<string>([^<]+)</string>').Groups[1].Value }
          $fail = @()
          Tool @('--set-team-code', '--nickname', 'CI') tool-code.txt
          if ((Get-Content $plist -Raw) -notmatch $code) { $fail += 'the code is not in the settings' }
          if (-not (Test-Path $bak) -or (Get-Content $bak -Raw) -notmatch $code) { $fail += 'the backup was not refreshed after --set-team-code' }
          $member = MemberId $plist
          Tool @('--clear-team-code') tool-empty.txt
          if ((Get-Content $plist -Raw) -match $code) { $fail += 'the code is still in the settings after --clear-team-code' }
          if ((Get-Content $bak -Raw) -match $code) { $fail += 'the backup still holds the code after --clear-team-code (a restore would turn the team back on)' }
          if ((MemberId $plist) -ne $member -or (MemberId $bak) -ne $member) { $fail += 'team.memberID changed' }
          $keys = @(Keys $plist)
          Set-Content -Path $plist -Value 'not a property list'
          Tool @('--set-team-code', '--nickname', 'CI') tool-code.txt
          $after = @(Keys $plist)
          $missing = @($keys | Where-Object { $after -notcontains $_ })
          "keys before the damage: $($keys.Count); after the restore and the new code: $($after.Count); missing: $($missing -join ', ')"
          if ($missing.Count -gt 0) { $fail += "settings lost through an unreadable file: $($missing -join ', ')" }
          if ((Get-Content $plist -Raw) -notmatch $code) { $fail += 'the code was not written after the restore' }
          Tool @('--clear-team-code') tool-empty.txt
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log') -Raw
          if ($log -match $code) { $fail += 'the log has the code' }
          if ($fail.Count -gt 0) { $fail | ForEach-Object { "FAIL team.codeTool: $_" }; exit 1 }
          'PASS team.codeTool: the backup follows set and clear (no code left after a clear), an unreadable file is restored first, memberID kept, no code in the log'
      - name: Team DNS-SD with mDNS turned off by policy (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          # What windns reports when mDNS is disabled (EnableMDNS=0, the policy switch). Restored afterwards.
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
          $old = (Get-ItemProperty -Path $key -Name EnableMDNS -ErrorAction SilentlyContinue).EnableMDNS
          "EnableMDNS before: $old"
          $alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
          Set-Content -NoNewline -Path mdns-code.txt -Value ("PTB-" + (-join (1..12 | ForEach-Object { $alphabet[(Get-Random -Maximum 32)] })))
          try {
              Set-ItemProperty -Path $key -Name EnableMDNS -Value 0 -Type DWord
              $p = Start-Process -FilePath $exe -PassThru -Wait -RedirectStandardInput mdns-code.txt -RedirectStandardOutput probe-mdns.out `
                  -ArgumentList @('--team-probe', '--code-stdin', '--seconds', '12', '--selftest-out', (Join-Path $PWD 'probe-mdns.txt'))
              Get-Content probe-mdns.txt | Select-String -Pattern 'ADVERTISE|REGISTER|BROWSE|RETRY|FOUND|LISTEN|RESULT'
          } finally {
              if ($null -eq $old) { Remove-ItemProperty -Path $key -Name EnableMDNS -ErrorAction SilentlyContinue }
              else { Set-ItemProperty -Path $key -Name EnableMDNS -Value $old -Type DWord }
          }
      - name: Tray screenshot (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          # The runner's desktop with the app running: whether the icon is visible there (Windows 11 may put it in the overflow).
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-shot'
          New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
          $p = Start-Process -FilePath (Resolve-Path bundle\PokeTokenBar.exe).Path -PassThru
          Start-Sleep -Seconds 15
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save((Join-Path $PWD 'tray-desktop.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          "screenshot $($b.Width)x$($b.Height)"
          Stop-Process -Id $p.Id -Force
      - name: Stall hunt (diagnostics, workflow_dispatch input)
        if: (success() || failure()) && steps.package.outcome == 'success' && github.event_name == 'workflow_dispatch' && env.PTB_STALL_HUNT != '0'
        continue-on-error: true
        shell: pwsh
        run: |
          # Fresh launches, each with its own state folder, so each has a launch refresh to watch.
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_SELFTEST_IDLE_SECONDS = '1'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          for ($i = 1; $i -le [int]$env:PTB_STALL_HUNT; $i++) {
              $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE "state-hunt-$i"
              New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
              $out = Join-Path $PWD "st-hunt-$i.json"
              $p = Start-Process -FilePath $exe -ArgumentList @('--selftest', '--selftest-out', $out) -PassThru
              $null = $p.Handle
              if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; "hunt ${i}: timed out"; continue }
              $j = Get-Content $out -Raw | ConvertFrom-Json
              foreach ($c in $j.checks) {
                  if ($c.name -eq 'loop.mainThreadStalls' -or -not $c.ok) {
                      "hunt {0} {1} {2}: {3}" -f $i, $(if ($c.ok) { 'PASS' } else { 'FAIL' }), $c.name, $c.detail
                  }
              }
          }
      - name: Version flag (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        continue-on-error: true
        shell: pwsh
        run: |
          $v = & bundle\PokeTokenBar.exe --version | Out-String
          "--version printed: '$($v.Trim())'"
      - name: Crash on purpose, then relaunch (default log folder)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: |
          # A child of the packaged exe installs the crash log like the app does and dies of a Swift fatalError (the
          # error mode is set in that child only). The log folder must then hold a crash record, a minidump and the
          # runtime's message; the next normal start must report the unclean end and take the record into the main log.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PtbCrashWin {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
              [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint msg, IntPtr w, IntPtr l);
          }
          '@
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $logs = Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs'
          Remove-Item -ErrorAction SilentlyContinue (Join-Path $logs 'PokeTokenBar-*.dmp'), (Join-Path $logs 'PokeTokenBar.crash.log'), (Join-Path $logs 'PokeTokenBar.running')
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest-crash', 'fatalError') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'the crash child did not end in 60 s' }
          'crash child exit: 0x{0:X8}' -f $p.ExitCode
          if ($p.ExitCode -eq 0) { throw 'the crash child exited 0' }
          $record = Get-Content (Join-Path $logs 'PokeTokenBar.crash.log') -Raw
          $record
          if ($record -notmatch '\[CRASH\] exception 0x[0-9A-F]{8} at 0x') { throw 'no crash record' }
          if ($record -notmatch '\[CRASH\] dump=off') { throw 'the record does not say dumps are off' }
          if (@(Get-ChildItem $logs -Filter 'PokeTokenBar-*.dmp').Count -ne 0) { throw 'a minidump was written without PTB_CRASH_DUMPS=1' }
          'no dump by default: ok'
          # Opted in: the same crash now also leaves a minidump.
          $env:PTB_CRASH_DUMPS = '1'
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest-crash', 'av') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'the opted-in crash child did not end in 60 s' }
          Remove-Item Env:PTB_CRASH_DUMPS
          'opted-in crash child exit: 0x{0:X8}' -f $p.ExitCode
          $dumps = @(Get-ChildItem $logs -Filter 'PokeTokenBar-*.dmp')
          "dumps: $($dumps.Name -join ', ') ($($dumps | ForEach-Object Length))"
          if ($dumps.Count -ne 1 -or $dumps[0].Length -le 0) { throw 'no minidump with PTB_CRASH_DUMPS=1' }
          if (-not (Test-Path (Join-Path $logs 'PokeTokenBar.running'))) { throw 'the running marker is gone after a crash' }
          if ((Get-Content (Join-Path $logs 'PokeTokenBar.stderr.log') -Raw) -notmatch 'selftest crash') { throw 'stderr.log lacks the fatalError message' }
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-crash'
          New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
          $app = Start-Process -FilePath $exe -PassThru
          $null = $app.Handle
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 150 -and $h -eq [IntPtr]::Zero; $i++) {
              Start-Sleep -Milliseconds 200
              if ($app.HasExited) { throw 'the relaunched app exited early' }
              $h = [PtbCrashWin]::FindWindowW('PokeTokenBarSink', [NullString]::Value)
          }
          if ($h -eq [IntPtr]::Zero) { throw 'the relaunched app made no sink window' }
          Start-Sleep -Seconds 2
          $null = [PtbCrashWin]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE
          if (-not $app.WaitForExit(20000)) { Stop-Process -Id $app.Id -Force; throw 'WM_CLOSE did not end the relaunched app' }
          "relaunched app exit: $($app.ExitCode)"
          $main = Get-Content (Join-Path $logs 'PokeTokenBar.log') -Raw
          foreach ($needle in 'previous session did not end cleanly', 'previous session crash record: [CRASH] exception') {
              if ($main -notmatch [regex]::Escape($needle)) { throw "the main log lacks: $needle" }
          }
          if (Test-Path (Join-Path $logs 'PokeTokenBar.running')) { throw 'the marker is still there after a clean exit' }
          if ((Get-Item (Join-Path $logs 'PokeTokenBar.crash.log')).Length -ne 0) { throw 'the crash record was not drained' }
          'relaunch reported the crash and ended cleanly'
      - name: Build the installers (this version, and a next one for the upgrade test)
        id: iscc
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
              $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after choco install innosetup' }
          $v = (Get-Content bundle\PokeTokenBar.version -Raw).Trim()
          $next = ($v -replace '\d+$', { [string]([int]$_.Value + 1) })
          $jobs = @(@{ Src = 'bundle'; Ver = $v; Out = 'installer-out' })
          if ($env:PTB_LEVEL -eq 'full') {  # the next version only serves the upgrade test
              Copy-Item bundle bundle-next -Recurse
              Set-Content -Path bundle-next\PokeTokenBar.version -Value $next -NoNewline
              $jobs += @{ Src = 'bundle-next'; Ver = $next; Out = 'installer-next' }
          }
          $defines = [ordered]@{}
          foreach ($job in $jobs) {
              New-Item -ItemType Directory -Force -Path $job.Out | Out-Null
              # Every /D goes through $isccArgs: iscc-defines.json records them per output folder, and the release manifest
              # asserts that the shipped installer (installer-out) had exactly SrcDir, AppVer and OutDir.
              $isccArgs = @("/DSrcDir=$((Resolve-Path $job.Src).Path)", "/DAppVer=$($job.Ver)", "/DOutDir=$((Resolve-Path $job.Out).Path)")
              $defines[$job.Out] = @($isccArgs | Where-Object { $_ -like '/D*' } | ForEach-Object { ($_ -replace '^/D', '') -replace '=.*$', '' })
              & $iscc /Q @isccArgs installer\PokeTokenBar.iss
              if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $($job.Ver)" }
          }
          $defines | ConvertTo-Json | Set-Content iscc-defines.json -Encoding utf8NoBOM
          "PTB_NEXT_VERSION=$next" >> $env:GITHUB_ENV
          foreach ($f in Get-ChildItem installer-out, installer-next -Filter *.exe -ErrorAction SilentlyContinue) { '{0}: {1:N0} bytes' -f $f.FullName, $f.Length }
          'bundle: {0:N0} bytes in {1} files' -f ((Get-ChildItem bundle -Recurse -File | Measure-Object Length -Sum).Sum), (Get-ChildItem bundle -Recurse -File).Count
          if (-not (Test-Path "installer-out\PokeTokenBar-Setup-$v-win-x64.exe")) { throw 'the installer has not the expected name' }
          # Inno pads its version strings with blanks: compare them trimmed.
          $vi = (Get-Item "installer-out\PokeTokenBar-Setup-$v-win-x64.exe").VersionInfo
          $fv, $pv, $fd = $vi.FileVersion, $vi.ProductVersion, $vi.FileDescription | ForEach-Object { "$_".Trim([char[]]@([char]32, [char]0)) }
          . ./scripts/windows/ci-helpers.ps1
          Assert-That ($fv -eq "$v.0" -and $pv -eq $v) 'iscc.versionInfo' "setup FileVersion='$fv' ProductVersion='$pv' FileDescription='$fd'; expected $v.0 / $v"
      - name: Silent install and what it left
        id: install
        if: (success() || failure()) && steps.iscc.outcome == 'success'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          # A fresh profile on this throwaway runner: nothing of the earlier steps' settings or state.
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $PtbPlist, "$PtbPlist.bak", (Join-Path $env:LOCALAPPDATA 'PokeTokenBar')
          $v = $env:PTB_VERSION
          $setup = Resolve-Path "installer-out\PokeTokenBar-Setup-$v-win-x64.exe"
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/NOLAUNCH=1', "/LOG=$PWD\install.log" -Wait -PassThru
          Assert-That ($proc.ExitCode -eq 0) 'install.exit' "exit $($proc.ExitCode)"
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          Assert-That (Test-Path $exe) 'install.exe' $exe
          $same = (Get-FileHash $exe).Hash -eq (Get-FileHash bundle\PokeTokenBar.exe).Hash
          $missing = @(Get-ChildItem bundle -Recurse -File | Where-Object { -not (Test-Path (Join-Path $PtbInstallDir $_.FullName.Substring((Resolve-Path bundle).Path.Length + 1))) })
          Assert-That ($same -and $missing.Count -eq 0) 'install.files' "exe identical to the bundle's: $same; bundle files missing from the install: $($missing.Count)"
          Assert-That ((Get-Content (Join-Path $PtbInstallDir 'PokeTokenBar.version') -Raw).Trim() -eq $v) 'install.version' $v
          Assert-That (Test-Path (Join-Path $PtbInstallDir 'licenses\THIRD-PARTY.txt')) 'install.licenses' 'licenses\THIRD-PARTY.txt'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PokeTokenBar.lnk'
          Assert-That (Test-Path $lnk) 'install.startMenu' $lnk
          $shell = New-Object -ComObject Shell.Application
          $item = $shell.NameSpace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf))
          $aumid = $item.ExtendedProperty('System.AppUserModel.ID')
          Assert-That ($aumid -eq 'LikelionCampus.PokeTokenBar') 'install.aumid' "shortcut AppUserModelID='$aumid'"
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '{6CE57293-9940-4B5E-A604-4C4FEECBF049}*' }
          Assert-That ($null -ne $key) 'install.uninstallKey' "$($key.PSChildName) DisplayVersion=$($key.GetValue('DisplayVersion'))"
          Assert-That ($key.GetValue('DisplayVersion') -eq $v) 'install.displayVersion' "Uninstall DisplayVersion=$($key.GetValue('DisplayVersion')), expected $v"
          Assert-That ($null -eq (Get-RunValue)) 'install.noRunValue' "HKCU Run PokeTokenBar: $(Get-RunValue)"
          Assert-That (-not (Get-Process PokeTokenBar -ErrorAction SilentlyContinue)) 'install.noLaunchWithFlag' '/NOLAUNCH=1 left no running instance'
          $item = Get-Item $exe
          "installed exe: $($item.VersionInfo.FileVersion) $($item.Length) bytes"
          # What the install showed, for the release manifest (the install folder is gone by then).
          [ordered]@{ fileVersion = $item.VersionInfo.FileVersion; versionFile = (Get-Content (Join-Path $PtbInstallDir 'PokeTokenBar.version') -Raw).Trim()
                      uninstallDisplayVersion = $key.GetValue('DisplayVersion') } | ConvertTo-Json | Set-Content install-stamps.json -Encoding utf8NoBOM
      - name: Upgrade over a running instance keeps settings and memberID
        id: upgrade
        if: (success() || failure()) && steps.install.outcome == 'success' && env.PTB_LEVEL == 'full'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          $logFile = Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log'
          # vN: run once so the app writes team.memberID, end it, then write a setting into the settings file.
          $p, $h = Start-App $exe
          Start-Sleep -Seconds 3
          $member = Get-MemberId
          Assert-That ([bool]$member) 'upgrade.memberIdWritten' "team.memberID=$member"
          Close-App $p $h
          $xml = Get-Content $PtbPlist -Raw
          $xml = $xml -replace '<key>statusChecksEnabled</key>\s*<(true|false)/>', ''
          $xml = $xml -replace '</dict>\s*</plist>\s*$', "<key>statusChecksEnabled</key><false/></dict></plist>"
          Set-Content -Path $PtbPlist -Value $xml -NoNewline -Encoding utf8NoBOM
          Assert-That ((Get-Content $PtbPlist -Raw) -match '<key>statusChecksEnabled</key>\s*<false/>') 'upgrade.settingWritten' 'statusChecksEnabled=false in PokeTokenBar.exe.plist'
          # vN is running when vN+1 is installed: the installer must close it (WM_CLOSE) and start the new one.
          $old, $oldHandle = Start-App $exe
          $closeLinesBefore = ([regex]::Matches((Get-Content $logFile -Raw), 'exit code=0 reason=closeRequest')).Count
          $next = $env:PTB_NEXT_VERSION
          $setup = Resolve-Path "installer-next\PokeTokenBar-Setup-$next-win-x64.exe"
          # No -Wait: it also waits for the app the installer starts. The setup itself must end by itself.
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$PWD\install-next.log" -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(180000)) { Stop-Process -Id $proc.Id -Force; Get-Content install-next.log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'the upgrade setup did not end in 180 s' }
          Assert-That ($proc.ExitCode -eq 0) 'upgrade.exit' "exit $($proc.ExitCode)"
          Assert-That ($old.HasExited -and $old.ExitCode -eq 0) 'upgrade.oldInstanceClosed' "old instance exited=$($old.HasExited) code=$($old.ExitCode)"
          $closeLinesAfter = ([regex]::Matches((Get-Content $logFile -Raw), 'exit code=0 reason=closeRequest')).Count
          Assert-That ($closeLinesAfter -eq $closeLinesBefore + 1) 'upgrade.closedCleanly' "closeRequest exit lines $closeLinesBefore -> $closeLinesAfter"
          Assert-That ((Get-Content (Join-Path $PtbInstallDir 'PokeTokenBar.version') -Raw).Trim() -eq $next) 'upgrade.filesReplaced' "version file = $next"
          # The installer launches the new version also when silent.
          $fresh = $null
          for ($i = 0; $i -lt 100 -and -not $fresh; $i++) { Start-Sleep -Milliseconds 200; $fresh = Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Select-Object -First 1 }
          Assert-That ($null -ne $fresh) 'upgrade.relaunched' 'a PokeTokenBar process runs after the silent upgrade'
          $null = $fresh.Handle
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 100 -and $h -eq [IntPtr]::Zero; $i++) { Start-Sleep -Milliseconds 200; $h = Find-Sink }
          Start-Sleep -Seconds 2
          $after = Get-MemberId
          Assert-That ($after -eq $member) 'upgrade.memberIdKept' "before=$member after=$after"
          Assert-That ((Get-Content $PtbPlist -Raw) -match '<key>statusChecksEnabled</key>\s*<false/>') 'upgrade.settingKept' 'statusChecksEnabled still false after the upgrade'
          Close-App $fresh $h
      - name: Installed selftest (stripped Path, from the install folder)
        id: installed-selftest
        if: (success() || failure()) && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $state = Join-Path $env:PTB_FIXTURE 'state-installed'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          $env:PTB_STATE_DIR = $state
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          # One retry: tray.menuKeys (a modal menu driven by injected keys, not ours) failed once in an installed run while the
          # same binary passed it in the bundle step of the same job. The first failure is printed, not hidden.
          $global:LASTEXITCODE = 0
          ./scripts/windows/run-selftest.ps1 -Exe $exe -Out st-installed.json -ExpectStrategy cfRunLoopWithMessages
          if ($LASTEXITCODE -ne 0) {
              "::warning::installed selftest failed once; retrying"
              Copy-Item st-installed.json st-installed-first.json -ErrorAction SilentlyContinue
              $global:LASTEXITCODE = 0
              ./scripts/windows/run-selftest.ps1 -Exe $exe -Out st-installed.json -ExpectStrategy cfRunLoopWithMessages
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # The checks that only mean something from a packaged copy must have run for real, not been skipped.
          $j = Get-Content st-installed.json -Raw | ConvertFrom-Json
          foreach ($name in 'packaged.processName', 'packaged.version', 'packaged.modules', 'log.writes', 'com.uiThreadSTA', 'plaza.resources', 'plaza.codec.png', 'plaza.codec.gif') {
              $c = $j.checks | Where-Object { $_.name -eq $name }
              Assert-That ($c -and $c.ok -and $c.detail -notlike 'skipped*') "installed.$name" $c.detail
          }
          "executed selftest checks: $(@($j.checks).Count)"
      - name: Idle gate (installed app, fixture data, 5 minute window with two store refreshes)
        id: idle
        if: (success() || failure()) && steps.install.outcome == 'success' && env.PTB_LEVEL == 'full' && env.PTB_FAST != 'true'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $verdicts = [ordered]@{}
          $summary = [ordered]@{ version = $env:PTB_VERSION; runner = $env:ImageVersion; windows = [ordered]@{} }

          # 1. A process that only sleeps, and explorer, over the same 120 s, before the app starts.
          $ps = Join-Path $env:windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $sleeper = Start-Process -FilePath $ps -ArgumentList '-NoProfile', '-Command', 'Start-Sleep 170' -PassThru
          Start-Sleep -Seconds 5
          ./scripts/windows/measure-idle.ps1 -ProcessId $sleeper.Id -Seconds 120 -Also explorer -Baseline -Label sleeper -Out idle-sleeper.json
          Stop-Process -Id $sleeper.Id -Force -ErrorAction SilentlyContinue
          $base = Get-Content idle-sleeper.json -Raw | ConvertFrom-Json
          $summary.sleeper = [ordered]@{ cyclesPerSec = $base.processCyclesPerSec; contextSwitchesPerMin = $base.contextSwitchesPerMin; explorerCycles = $base.explorerCycles; explorerContextSwitches = ($base.also | Where-Object name -eq 'explorer').contextSwitches }

          # 2. The installed app, one window per state. Budgets are from the first measured runs, with margin (see the report).
          function Measure-App([string]$Label, [int]$Seconds, [string]$Settings, [hashtable]$Budget, [string[]]$AppArgs = @()) {
              Remove-Item -ErrorAction SilentlyContinue $PtbPlist, "$PtbPlist.bak"
              if ($Settings) { Set-Content -Path $PtbPlist -Value $Settings -Encoding utf8NoBOM }
              $state = Join-Path $env:PTB_FIXTURE "state-idle-$Label"
              New-Item -ItemType Directory -Force -Path $state | Out-Null
              $env:PTB_STATE_DIR = $state
              $p, $h = Start-App $exe $AppArgs
              Start-Sleep -Seconds 30
              $m = @{ ProcessId = $p.Id; Seconds = $Seconds; Label = $Label; Out = "idle-$Label.json" }
              foreach ($k in $Budget.Keys) { $m[$k] = $Budget[$k] }
              $global:LASTEXITCODE = 0
              ./scripts/windows/measure-idle.ps1 @m
              $code = $LASTEXITCODE
              Close-App $p $h
              $verdicts[$Label] = ($code -eq 0)
              $j = Get-Content "idle-$Label.json" -Raw | ConvertFrom-Json
              $summary.windows[$Label] = [ordered]@{ seconds = $Seconds; pass = ($code -eq 0); budget = $Budget; processCycles = $j.processCycles; cyclesPerSec = $j.processCyclesPerSec; cpuSeconds = $j.processCpuSeconds; contextSwitchesPerMin = $j.contextSwitchesPerMin; mainThreadContextSwitches = $j.mainThreadContextSwitches; privateMB = "$($j.privateMBStart) -> $($j.privateMBEnd)"; handles = "$($j.handlesStart) -> $($j.handlesEnd)"; threads = @($j.threads | Where-Object { $_.contextSwitches -gt 0 } | Select-Object tid, main, name, start, contextSwitches, cycles) }
          }
          $off = '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>refreshInterval</key><real>0</real></dict></plist>'
          $offNoStatus = '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>refreshInterval</key><real>0</real><key>statusChecksEnabled</key><false/></dict></plist>'
          $noStatus = '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>statusChecksEnabled</key><false/></dict></plist>'
          $budget = @{ MaxMainCsPerMin = 6; MaxProcessCsPerMin = 250; MaxProcessCyclesPerSec = 450000; MaxPrivateGrowthMB = 5; MaxHandleGrowth = 10 }
          # refreshInterval = 0: nothing is due after the launch refresh (the D8 window), 120 s.
          Measure-App 'manual-refresh-120s' 120 $off $budget
          # The normal app: 120 s polling, status checks on. 300 s from 30 s after launch covers the refreshes at +120 s and +240 s.
          # Budgets: 1.5x the worst of 4 runs of the same code (d46c7b3, a78a992; status checks through WinHTTP, PlatformCompat.oneShotData):
          # main thread 19-20/min (2.5/min idle + ~40 per refresh), process 166-186 cs/min and 1.39-2.03 M cycles/s (cycles spread ~1.5x
          # run to run); private and handles are leak bounds.
          # Before (URLSession): every refresh connected afresh and two dispatch threads woke each other 25-50k times a second for the
          # whole transfer, 1568-7209 cs/min and 3.3-5.5 M cycles/s, under a budget of 4000 (defect log, "윈도우 URLSession"). One such
          # refresh (>= 6k cs) now fails the cs budget on its own.
          Measure-App 'normal-300s' 300 '' @{ MaxMainCsPerMin = 30; MaxProcessCsPerMin = 280; MaxProcessCyclesPerSec = 3000000; MaxPrivateGrowthMB = 5; MaxHandleGrowth = 10 }
          # Stage 6 Task 5: the plaza open (the selftest helper opens the app's own plaza; no team, nobody else in it), with
          # refresh off as in the first window, so the difference to 'manual-refresh-120s' is the plaza's. On the runner the
          # device is WARP (CPU rendering): every drawn frame is CPU time here that a GPU does on a PC.
          $logFile = Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log'
          foreach ($mode in 'visible', 'minimized') {
              $label = "plaza-$mode-120s"
              # Budgets: 1.5x the worst of three runs (43697872729, 43702099267, 43706983988; stage 6 Task 5 report). Minimized
              # (main 396-410/min, process 3502-3575 cs/min, 5.3-6.8 M cycles/s): the frame clock is parked and the cover check off;
              # what wakes the app is the shared controller (1 s focus tick, 1 s watchdog, the ditto host's 50-250 ms loop, on the Mac
              # too). Visible, nobody walking (main 5030-9922/min, 64-78 k cs/min, 0.28-0.81 G cycles/s): WARP draws on the CPU here.
              $budgetPlaza = if ($mode -eq 'minimized') {
                  @{ MaxMainCsPerMin = 615; MaxProcessCsPerMin = 5360; MaxProcessCyclesPerSec = 10300000; MaxPrivateGrowthMB = 5; MaxHandleGrowth = 10 }
              } else {
                  @{ MaxMainCsPerMin = 14900; MaxProcessCsPerMin = 117500; MaxProcessCyclesPerSec = 1220000000; MaxPrivateGrowthMB = 5; MaxHandleGrowth = 10 }
              }
              Measure-App $label 120 $off $budgetPlaza @('--plaza-idle-probe', $mode)
              $lines = @(Select-String -Path $logFile -Pattern 'plaza idle helper|plaza open at exit|plaza window open|plaza window: not opened' -ErrorAction SilentlyContinue | Select-Object -Last 3 | ForEach-Object { $_.Line })
              $lines
              $summary.windows[$label].plazaLog = $lines
          }
          # --- stage 7 Task 3: the popover kit open and still (begin) ---
          # The kit's gallery page (every control and a drawn part), focus in a field, refresh off: the same budget as the closed
          # app's 'manual-refresh-120s' window (an open, idle popover may cost nothing more).
          Measure-App 'popover-kit-open-120s' 120 $off $budget @('--popover-kit-idle-probe')
          $summary.windows['popover-kit-open-120s'].kitLog = @(Select-String -Path $logFile -Pattern 'popover kit idle probe' -ErrorAction SilentlyContinue | Select-Object -Last 1 | ForEach-Object { $_.Line })
          # --- stage 7 Task 3: the popover kit open and still (end) ---
          # --- stage 7 Task 4: the popover window open and still, and closed after an open (begin) ---
          # The real popover (empty page, opened through the tray callback), refresh off: the closed app's budget for both. Closed
          # after an open must cost what never opened costs (D18); open and still adds no timer.
          foreach ($mode in 'open', 'closed') {
              $label = "popover-$mode-120s"
              Measure-App $label 120 $off $budget @('--popover-idle-probe', $mode)
              $summary.windows[$label].popoverLog = @(Select-String -Path $logFile -Pattern 'popover idle probe' -ErrorAction SilentlyContinue | Select-Object -Last 1 | ForEach-Object { $_.Line })
          }
          # --- stage 7 Task 4: the popover window open and still, and closed after an open (end) ---
          $summary.verdicts = $verdicts
          $summary | ConvertTo-Json -Depth 8 | Set-Content idle-gate.json -Encoding utf8
          Get-Content idle-gate.json
          if ($verdicts.Values -contains $false) { throw "idle gate FAILED: $(($verdicts.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object Key) -join ', ')" }
          'PASS idle gate'
      - name: Waker hunt (the two ~1 Hz threads; diagnostics)
        if: (success() || failure()) && steps.install.outcome == 'success' && env.PTB_DIAGNOSTICS == 'true' && env.PTB_FAST != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $state = Join-Path $env:PTB_FIXTURE 'state-hunt'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          $env:PTB_STATE_DIR = $state
          $out = Join-Path $PWD 'waker-hunt.json'
          $p = Start-Process -FilePath (Join-Path $PtbInstallDir 'PokeTokenBar.exe') -ArgumentList '--selftest-waker-hunt', $out, '30' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; throw 'the waker hunt did not finish in 15 min' }
          "exit $($p.ExitCode)"
          foreach ($ph in (Get-Content $out -Raw | ConvertFrom-Json)) { "== $($ph.phase)"; $ph.detail }
      - name: Timeline of the installed app (when does a waker start; diagnostics)
        if: (success() || failure()) && steps.install.outcome == 'success' && env.PTB_DIAGNOSTICS == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $cases = [ordered]@{
              'timeline-normal' = '';
              'timeline-nostatus' = '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>statusChecksEnabled</key><false/></dict></plist>'
          }
          foreach ($k in $cases.Keys) {
              Remove-Item -ErrorAction SilentlyContinue $PtbPlist, "$PtbPlist.bak"
              if ($cases[$k]) { Set-Content -Path $PtbPlist -Value $cases[$k] -Encoding utf8NoBOM }
              $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE "state-$k"
              New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
              $p, $h = Start-App $exe
              "== ${k}: app started $((Get-Date).ToUniversalTime().ToString('HH:mm:ss')) UTC"
              ./scripts/windows/measure-idle.ps1 -ProcessId $p.Id -Seconds 330 -SliceSeconds 15 -Label $k -Out "idle-$k.json"
              Close-App $p $h
              Get-Content (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log') | Select-String 'refresh done|launched' | Select-Object -Last 4
          }
      - name: Waker modes (what each way of waiting costs on its own; diagnostics)
        if: (success() || failure()) && steps.install.outcome == 'success' && env.PTB_DIAGNOSTICS == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          $modes = [ordered]@{
              'none' = @('none'); 'distant' = @('distant'); 'task' = @('task'); 'taskmain' = @('taskmain'); 'tasksleep' = @('tasksleep');
              'thread' = @('thread'); 'globalqueue' = @('globalqueue'); 'mainqueue' = @('mainqueue'); 'asyncafter' = @('asyncafter');
              'dispatchtimer' = @('dispatchtimer');
              'timer-20-2' = @('timer', '20', '2'); 'timer-20-0' = @('timer', '20', '0');
              'timertask-20-2' = @('timer', '20', '2', 'task'); 'timertask-20-0' = @('timer', '20', '0', 'task');
              'timertask-120-12' = @('timer', '120', '12', 'task'); 'timertask-120-0' = @('timer', '120', '0', 'task')
          }
          $procs = @{}
          foreach ($k in $modes.Keys) { $procs[$k] = Start-Process -FilePath $exe -ArgumentList (@('--selftest-park') + $modes[$k]) -PassThru }
          Start-Sleep -Seconds 15
          # All windows at once, each measured by its own pwsh, so the whole set costs one window.
          $meas = @{}
          foreach ($k in $modes.Keys) {
              if ($procs[$k].HasExited) { "mode ${k}: exited early ($($procs[$k].ExitCode))"; continue }
              $meas[$k] = Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', (Resolve-Path ./scripts/windows/measure-idle.ps1).Path, '-ProcessId', $procs[$k].Id, '-Seconds', 200, '-Label', "park-$k", '-Out', "idle-park-$k.json" -RedirectStandardOutput "park-$k.txt" -PassThru
          }
          foreach ($k in $meas.Keys) { $null = $meas[$k].WaitForExit(300000) }
          foreach ($k in $modes.Keys) { if (Test-Path "park-$k.txt") { Get-Content "park-$k.txt" } }
          foreach ($k in $modes.Keys) { Stop-Process -Id $procs[$k].Id -Force -ErrorAction SilentlyContinue }
      - name: Silent uninstall and what it leaves
        id: uninstall
        if: (success() || failure()) && steps.install.outcome == 'success' && env.PTB_LEVEL == 'full'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $data = Join-Path $env:LOCALAPPDATA 'PokeTokenBar'
          # What the app's tray toggle would have written: the Run value that starts THIS install.
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'PokeTokenBar' -Value "`"$exe`" --autostart"
          Assert-That ($null -ne (Get-RunValue)) 'uninstall.runValueSetUp' (Get-RunValue)
          # Leave something in the app's folder too: the uninstaller takes the folder, not just its own files.
          Set-Content -Path (Join-Path $PtbInstallDir 'stray.txt') -Value 'x'
          $before = @(Get-ChildItem $data -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $plistBefore = Test-Path $PtbPlist
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '{6CE57293-9940-4B5E-A604-4C4FEECBF049}*' }
          $unins = (Get-Item (Join-Path $PtbInstallDir 'unins000.exe')).FullName
          $proc = Start-Process -FilePath $unins -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\uninstall.log" -Wait -PassThru
          Assert-That ($proc.ExitCode -eq 0) 'uninstall.exit' "exit $($proc.ExitCode)"
          for ($i = 0; $i -lt 60 -and (Test-Path $PtbInstallDir); $i++) { Start-Sleep -Milliseconds 500 }  # the uninstaller deletes itself after it exits
          Assert-That (-not (Test-Path $PtbInstallDir)) 'uninstall.appFolderGone' $PtbInstallDir
          Assert-That ($null -eq (Get-RunValue)) 'uninstall.runValueGone' "Run PokeTokenBar: $(Get-RunValue)"
          Assert-That (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PokeTokenBar.lnk'))) 'uninstall.startMenuGone' 'Start-menu shortcut removed'
          $keyAfter = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '{6CE57293-9940-4B5E-A604-4C4FEECBF049}*' }
          Assert-That ($null -eq $keyAfter) 'uninstall.keyGone' 'Uninstall registry key removed'
          $after = @(Get-ChildItem $data -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          Assert-That ($plistBefore -and (Test-Path $PtbPlist) -and $after.Count -ge $before.Count) 'uninstall.dataKept' "settings plist kept: $(Test-Path $PtbPlist); files under %LOCALAPPDATA%\PokeTokenBar: $($before.Count) before, $($after.Count) after"
          "left behind: $PtbPlist (+ .bak: $(Test-Path "$PtbPlist.bak")); $data ($($after.Count) files: $((($after | ForEach-Object { Split-Path $_ -Leaf }) | Select-Object -First 12) -join ', '))"
      - name: Upgrade from the previous published Windows release
        id: upgrade-from-release
        if: (success() || failure()) && steps.uninstall.outcome == 'success' && env.PTB_LEVEL == 'full'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}  # read-only, for the API rate limit
        run: ./scripts/windows/upgrade-from-release.ps1 -Version $env:PTB_VERSION -Installer "installer-out\PokeTokenBar-Setup-$env:PTB_VERSION-win-x64.exe"
      # New gate steps go above this line ("Collect logs"); the two release-mode steps stay last.
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path collected | Out-Null
          Copy-Item -ErrorAction SilentlyContinue (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\*') collected
          Copy-Item -ErrorAction SilentlyContinue (Join-Path $env:LOCALAPPDATA '*.plist') collected
          Copy-Item -ErrorAction SilentlyContinue install.log, install-next.log, uninstall.log, package.log collected
          Get-ChildItem collected | ForEach-Object { $_.Name }
      # The installer is a CI artifact only (short retention): nothing is attached to a release or uploaded elsewhere.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: installer-out/PokeTokenBar-Setup-*-win-x64.exe
          retention-days: 3
          if-no-files-found: warn
      # stage 7 Task 3: the popover kit's gallery alone (small download; the same files are in windows-app too)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-kit
          retention-days: 7
          path: ui-dump/kit
          if-no-files-found: warn
      # stage 7 Task 4: the popover window's captures (anchored at the runner's tray; the synthetic placements)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-popover
          retention-days: 7
          path: ui-dump/popover
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app
          retention-days: 7
          path: |
            bundle
            st*.json
            idle*.json
            waker-hunt.json
            net-burst.json
            st*.json.lines
            tray-desktop.png
            plaza-*.png
            probe-*.txt
            ui-dump
            lang-probe
            collected
            build.log
            .build/*/release/PokeTokenBarWin.pdb
      # Release mode, last: only a run where every step above passed leaves windows-release (installer + manifest).
      - name: Release manifest
        if: success() && inputs.release_sha != ''
        shell: pwsh
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PTB_STEPS: ${{ toJSON(steps) }}
        run: ./scripts/windows/release-manifest.ps1 -Out windows-release
      - uses: actions/upload-artifact@v4
        if: success() && inputs.release_sha != ''
        with:
          name: windows-release
          path: windows-release/
          retention-days: 7
          if-no-files-found: error
