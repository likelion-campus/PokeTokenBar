name: windows-app
# Builds and self-tests the Windows app executable. Informational: not a required check.
on:
  push:
    branches: [windows-port]
  pull_request:
    paths:
      - 'Sources/PokeTokenBar/Platform/**'
      - 'Sources/CWinShim/**'
      - 'Sources/CTeamTLS/**'
      - 'Sources/PokeTokenBarWin/**'
      - 'Tests/PokeTokenBarTests/Windows*'
      - 'Package.swift'
      - 'windows/**'
      - 'scripts/windows/**'
      - 'installer/**'
      - '.github/workflows/windows-app.yml'
      - '.github/actions/windows-swift/**'
  workflow_dispatch:
    inputs:
      stall_hunt:
        description: 'Extra selftest launches that report main-thread stalls (diagnostics; 0 = none)'
        default: '0'
permissions:
  contents: read
concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/windows-swift
      - name: Build
        shell: bash
        run: swift build -c release --product PokeTokenBarWin 2>&1 | tee build.log
      - name: Package
        id: package
        shell: pwsh
        run: ./scripts/windows/package.ps1 -Out bundle
      - name: Selftest fixture
        shell: pwsh
        run: |
          # Claude Code logs dated "today", so the store's refresh has a known total; a fresh state folder.
          $fx = Join-Path $env:RUNNER_TEMP 'ptb-selftest'
          $proj = Join-Path $fx 'claude\projects\p'
          New-Item -ItemType Directory -Force -Path $proj, (Join-Path $fx 'state'), (Join-Path $fx 'state-dispatch') | Out-Null
          $ts = (Get-Date).ToUniversalTime().AddSeconds(-30).ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          (Get-Content 'windows\selftest\claude\projects\p\s.jsonl' -Raw).Replace('__TIMESTAMP__', $ts) |
            Set-Content -NoNewline -Encoding utf8NoBOM -Path (Join-Path $proj 's.jsonl')
          "PTB_FIXTURE=$fx" >> $env:GITHUB_ENV
      - name: Selftest with a stripped Path
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state'
          # The fixture's usage after (message.id, requestId) dedup: 1000+200+30+4 + 2000+400+60+8.
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          ./scripts/windows/run-selftest.ps1 -Exe bundle\PokeTokenBar.exe -Out st.json -ExpectStrategy cfRunLoopWithMessages
      - name: Selftest on the dispatch-handle loop (diagnostic fallback, informational)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        continue-on-error: true
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-dispatch'
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          $env:PTB_WIN_LOOP = 'dispatch'
          $env:PTB_SELFTEST_IDLE_SECONDS = '20'
          ./scripts/windows/run-selftest.ps1 -Exe bundle\PokeTokenBar.exe -Out st-dispatch.json -ExpectStrategy dispatchHandle
      - name: Kill and exit paths of the full app
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: |
          # The app writes team.memberID at launch and saves it right after the stores are built. Kill it
          # (TerminateProcess), start it again: the same memberID must come back. Then WM_CLOSE and
          # WM_ENDSESSION must each end it through WindowsApp.exit with exit code 0.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PtbWin {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
              [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint msg, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern IntPtr SendMessageTimeoutW(IntPtr h, uint msg, IntPtr w, IntPtr l, uint flags, uint timeout, out IntPtr result);
          }
          '@
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $plist = Join-Path $env:LOCALAPPDATA 'PokeTokenBar.exe.plist'
          $title = 'Local\PokeTokenBar-Team'
          function MemberId {
              if (-not (Test-Path $plist)) { return $null }
              $m = [regex]::Match((Get-Content $plist -Raw), '<key>team\.memberID</key>\s*<string>([^<]+)</string>')
              if ($m.Success) { return $m.Groups[1].Value } else { return $null }
          }
          function Start-App {
              $p = Start-Process -FilePath $exe -PassThru
              $null = $p.Handle
              for ($i = 0; $i -lt 150; $i++) {
                  $h = [PtbWin]::FindWindowW('PokeTokenBarSink', $title)
                  if ($h -ne [IntPtr]::Zero) { return @($p, $h) }
                  Start-Sleep -Milliseconds 200
              }
              throw 'the app made no sink window in 30 s'
          }
          "memberID before the first start: $(MemberId)"
          $p, $h = Start-App
          Start-Sleep -Seconds 2
          $first = MemberId
          Stop-Process -Id $p.Id -Force
          $null = $p.WaitForExit(10000)
          "killed (exit $($p.ExitCode)): memberID on disk = $first"
          if (-not $first) { throw 'team.memberID was not on disk 2 s after launch' }
          $p, $h = Start-App
          Start-Sleep -Seconds 2
          $second = MemberId
          "restarted: memberID on disk = $second"
          if ($second -ne $first) { throw "memberID changed across the kill: $first -> $second" }
          $null = [PtbWin]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE
          if (-not $p.WaitForExit(15000)) { throw 'WM_CLOSE did not end the app' }
          "WM_CLOSE: exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WM_CLOSE: exit code $($p.ExitCode)" }
          $p, $h = Start-App
          Start-Sleep -Seconds 1
          $reply = [IntPtr]::Zero
          $null = [PtbWin]::SendMessageTimeoutW($h, 0x0016, [IntPtr]1, [IntPtr]::Zero, 0, 5000, [ref]$reply)  # WM_ENDSESSION(TRUE)
          if (-not $p.WaitForExit(15000)) { throw 'WM_ENDSESSION did not end the app' }
          "WM_ENDSESSION: exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WM_ENDSESSION: exit code $($p.ExitCode)" }
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log') -Raw
          foreach ($reason in 'closeRequest', 'endSession') {
              if ($log -notmatch "exit code=0 reason=$reason") { throw "no 'reason=$reason' exit line in the log" }
          }
          'log has both exit lines'
      - name: Tray screenshot (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          # The runner's desktop with the app running: whether the icon is visible there (Windows 11 may put it in the overflow).
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-shot'
          New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
          $p = Start-Process -FilePath (Resolve-Path bundle\PokeTokenBar.exe).Path -PassThru
          Start-Sleep -Seconds 15
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save((Join-Path $PWD 'tray-desktop.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          "screenshot $($b.Width)x$($b.Height)"
          Stop-Process -Id $p.Id -Force
      - name: Stall hunt (diagnostics, workflow_dispatch input)
        if: (success() || failure()) && steps.package.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.stall_hunt != '0'
        continue-on-error: true
        shell: pwsh
        run: |
          # Fresh launches, each with its own state folder, so each has a launch refresh to watch.
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_SELFTEST_IDLE_SECONDS = '1'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          for ($i = 1; $i -le [int]'${{ inputs.stall_hunt }}'; $i++) {
              $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE "state-hunt-$i"
              New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
              $out = Join-Path $PWD "st-hunt-$i.json"
              $p = Start-Process -FilePath $exe -ArgumentList @('--selftest', '--selftest-out', $out) -PassThru
              $null = $p.Handle
              if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; "hunt ${i}: timed out"; continue }
              $j = Get-Content $out -Raw | ConvertFrom-Json
              foreach ($c in $j.checks) {
                  if ($c.name -eq 'loop.mainThreadStalls' -or -not $c.ok) {
                      "hunt {0} {1} {2}: {3}" -f $i, $(if ($c.ok) { 'PASS' } else { 'FAIL' }), $c.name, $c.detail
                  }
              }
          }
      - name: Version flag (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        continue-on-error: true
        shell: pwsh
        run: |
          $v = & bundle\PokeTokenBar.exe --version | Out-String
          "--version printed: '$($v.Trim())'"
      - name: Crash on purpose, then relaunch (default log folder)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: |
          # A child of the packaged exe installs the crash log like the app does and dies of a Swift fatalError (the
          # error mode is set in that child only). The log folder must then hold a crash record, a minidump and the
          # runtime's message; the next normal start must report the unclean end and take the record into the main log.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PtbCrashWin {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
              [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint msg, IntPtr w, IntPtr l);
          }
          '@
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $logs = Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs'
          Remove-Item -ErrorAction SilentlyContinue (Join-Path $logs 'PokeTokenBar-*.dmp'), (Join-Path $logs 'PokeTokenBar.crash.log'), (Join-Path $logs 'PokeTokenBar.running')
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest-crash', 'fatalError') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'the crash child did not end in 60 s' }
          'crash child exit: 0x{0:X8}' -f $p.ExitCode
          if ($p.ExitCode -eq 0) { throw 'the crash child exited 0' }
          $record = Get-Content (Join-Path $logs 'PokeTokenBar.crash.log') -Raw
          $record
          if ($record -notmatch '\[CRASH\] exception 0x[0-9A-F]{8} at 0x') { throw 'no crash record' }
          $dumps = @(Get-ChildItem $logs -Filter 'PokeTokenBar-*.dmp')
          "dumps: $($dumps.Name -join ', ') ($($dumps | ForEach-Object Length))"
          if ($dumps.Count -lt 1 -or $dumps[0].Length -le 0) { throw 'no minidump' }
          if (-not (Test-Path (Join-Path $logs 'PokeTokenBar.running'))) { throw 'the running marker is gone after a crash' }
          if ((Get-Content (Join-Path $logs 'PokeTokenBar.stderr.log') -Raw) -notmatch 'selftest crash') { throw 'stderr.log lacks the fatalError message' }
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-crash'
          New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
          $app = Start-Process -FilePath $exe -PassThru
          $null = $app.Handle
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 150 -and $h -eq [IntPtr]::Zero; $i++) {
              Start-Sleep -Milliseconds 200
              if ($app.HasExited) { throw 'the relaunched app exited early' }
              $h = [PtbCrashWin]::FindWindowW('PokeTokenBarSink', $null)
          }
          if ($h -eq [IntPtr]::Zero) { throw 'the relaunched app made no sink window' }
          Start-Sleep -Seconds 2
          $null = [PtbCrashWin]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE
          if (-not $app.WaitForExit(20000)) { Stop-Process -Id $app.Id -Force; throw 'WM_CLOSE did not end the relaunched app' }
          "relaunched app exit: $($app.ExitCode)"
          $main = Get-Content (Join-Path $logs 'PokeTokenBar.log') -Raw
          foreach ($needle in 'previous session did not end cleanly', 'previous session crash record: [CRASH] exception') {
              if ($main -notmatch [regex]::Escape($needle)) { throw "the main log lacks: $needle" }
          }
          if (Test-Path (Join-Path $logs 'PokeTokenBar.running')) { throw 'the marker is still there after a clean exit' }
          if ((Get-Item (Join-Path $logs 'PokeTokenBar.crash.log')).Length -ne 0) { throw 'the crash record was not drained' }
          'relaunch reported the crash and ended cleanly'
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path collected | Out-Null
          Copy-Item -ErrorAction SilentlyContinue (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\*') collected
          Copy-Item -ErrorAction SilentlyContinue (Join-Path $env:LOCALAPPDATA '*.plist') collected
          Get-ChildItem collected | ForEach-Object { $_.Name }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app
          path: |
            bundle
            st*.json
            st*.json.lines
            tray-desktop.png
            collected
            build.log
            .build/*/release/PokeTokenBarWin.pdb
