name: windows-app
# Builds and self-tests the Windows app executable. Informational: not a required check.
on:
  push:
    branches: [windows-port]
  pull_request:
    paths:
      - 'Sources/PokeTokenBar/Platform/**'
      - 'Sources/CWinShim/**'
      - 'Sources/CTeamTLS/**'
      - 'Sources/PokeTokenBarWin/**'
      - 'Tests/PokeTokenBarTests/Windows*'
      - 'Package.swift'
      - 'windows/**'
      - 'scripts/windows/**'
      - 'installer/**'
      - 'assets/AppIcon.ico'
      - '.github/workflows/windows-app.yml'
      - '.github/actions/windows-swift/**'
  workflow_dispatch:
    inputs:
      fast:
        description: 'Skip the long idle gate and the waker hunt (true/false)'
        default: 'false'
      stall_hunt:
        description: 'Extra selftest launches that report main-thread stalls (diagnostics; 0 = none)'
        default: '0'
permissions:
  contents: read
concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/windows-swift
      - name: Resources (version info, icon, manifest)
        id: resources
        shell: pwsh
        run: |
          $res = ./scripts/windows/build-resources.ps1 -Out resources | Select-Object -Last 1
          "PTB_RES=$($res -replace '\\', '/')" >> $env:GITHUB_ENV
      - name: Build
        shell: bash
        run: swift build -c release --product PokeTokenBarWin -Xlinker "$PTB_RES" 2>&1 | tee build.log
      - name: Package
        id: package
        shell: pwsh
        run: |
          ./scripts/windows/package.ps1 -Out bundle 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PTB_VERSION=$((Get-Content bundle\PokeTokenBar.version -Raw).Trim())" >> $env:GITHUB_ENV
      - name: Selftest fixture
        shell: pwsh
        run: |
          # Claude Code logs dated "today", so the store's refresh has a known total; a fresh state folder.
          $fx = Join-Path $env:RUNNER_TEMP 'ptb-selftest'
          $proj = Join-Path $fx 'claude\projects\p'
          New-Item -ItemType Directory -Force -Path $proj, (Join-Path $fx 'state'), (Join-Path $fx 'state-dispatch') | Out-Null
          $ts = (Get-Date).ToUniversalTime().AddSeconds(-30).ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          (Get-Content 'windows\selftest\claude\projects\p\s.jsonl' -Raw).Replace('__TIMESTAMP__', $ts) |
            Set-Content -NoNewline -Encoding utf8NoBOM -Path (Join-Path $proj 's.jsonl')
          "PTB_FIXTURE=$fx" >> $env:GITHUB_ENV
      - name: Selftest with a stripped Path
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state'
          # The fixture's usage after (message.id, requestId) dedup: 1000+200+30+4 + 2000+400+60+8.
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          ./scripts/windows/run-selftest.ps1 -Exe bundle\PokeTokenBar.exe -Out st.json -ExpectStrategy cfRunLoopWithMessages -DumpUi (Join-Path $PWD 'ui-dump')
      - name: Selftest on the dispatch-handle loop (diagnostic fallback, informational)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        continue-on-error: true
        shell: pwsh
        run: |
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-dispatch'
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          $env:PTB_WIN_LOOP = 'dispatch'
          $env:PTB_SELFTEST_IDLE_SECONDS = '20'
          ./scripts/windows/run-selftest.ps1 -Exe bundle\PokeTokenBar.exe -Out st-dispatch.json -ExpectStrategy dispatchHandle
      - name: Kill and exit paths of the full app
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: |
          # The app writes team.memberID at launch and saves it right after the stores are built. Kill it
          # (TerminateProcess), start it again: the same memberID must come back. Then WM_CLOSE and
          # WM_ENDSESSION must each end it through WindowsApp.exit with exit code 0.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PtbWin {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
              [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint msg, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern IntPtr SendMessageTimeoutW(IntPtr h, uint msg, IntPtr w, IntPtr l, uint flags, uint timeout, out IntPtr result);
          }
          '@
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $plist = Join-Path $env:LOCALAPPDATA 'PokeTokenBar.exe.plist'
          $title = 'Local\PokeTokenBar-Team'
          function MemberId {
              if (-not (Test-Path $plist)) { return $null }
              $m = [regex]::Match((Get-Content $plist -Raw), '<key>team\.memberID</key>\s*<string>([^<]+)</string>')
              if ($m.Success) { return $m.Groups[1].Value } else { return $null }
          }
          function Start-App {
              $p = Start-Process -FilePath $exe -PassThru
              $null = $p.Handle
              for ($i = 0; $i -lt 150; $i++) {
                  $h = [PtbWin]::FindWindowW('PokeTokenBarSink', $title)
                  if ($h -ne [IntPtr]::Zero) { return @($p, $h) }
                  Start-Sleep -Milliseconds 200
              }
              throw 'the app made no sink window in 30 s'
          }
          "memberID before the first start: $(MemberId)"
          $p, $h = Start-App
          Start-Sleep -Seconds 2
          $first = MemberId
          Stop-Process -Id $p.Id -Force
          $null = $p.WaitForExit(10000)
          "killed (exit $($p.ExitCode)): memberID on disk = $first"
          if (-not $first) { throw 'team.memberID was not on disk 2 s after launch' }
          $p, $h = Start-App
          Start-Sleep -Seconds 2
          $second = MemberId
          "restarted: memberID on disk = $second"
          if ($second -ne $first) { throw "memberID changed across the kill: $first -> $second" }
          $null = [PtbWin]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE
          if (-not $p.WaitForExit(15000)) { throw 'WM_CLOSE did not end the app' }
          "WM_CLOSE: exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WM_CLOSE: exit code $($p.ExitCode)" }
          $p, $h = Start-App
          Start-Sleep -Seconds 1
          $reply = [IntPtr]::Zero
          $null = [PtbWin]::SendMessageTimeoutW($h, 0x0016, [IntPtr]1, [IntPtr]::Zero, 0, 5000, [ref]$reply)  # WM_ENDSESSION(TRUE)
          if (-not $p.WaitForExit(15000)) { throw 'WM_ENDSESSION did not end the app' }
          "WM_ENDSESSION: exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "WM_ENDSESSION: exit code $($p.ExitCode)" }
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log') -Raw
          foreach ($reason in 'closeRequest', 'endSession') {
              if ($log -notmatch "exit code=0 reason=$reason") { throw "no 'reason=$reason' exit line in the log" }
          }
          'log has both exit lines'
      - name: Tray screenshot (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          # The runner's desktop with the app running: whether the icon is visible there (Windows 11 may put it in the overflow).
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-shot'
          New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
          $p = Start-Process -FilePath (Resolve-Path bundle\PokeTokenBar.exe).Path -PassThru
          Start-Sleep -Seconds 15
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save((Join-Path $PWD 'tray-desktop.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          "screenshot $($b.Width)x$($b.Height)"
          Stop-Process -Id $p.Id -Force
      - name: Stall hunt (diagnostics, workflow_dispatch input)
        if: (success() || failure()) && steps.package.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.stall_hunt != '0'
        continue-on-error: true
        shell: pwsh
        run: |
          # Fresh launches, each with its own state folder, so each has a launch refresh to watch.
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $env:PTB_SELFTEST_IDLE_SECONDS = '1'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          for ($i = 1; $i -le [int]'${{ inputs.stall_hunt }}'; $i++) {
              $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE "state-hunt-$i"
              New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
              $out = Join-Path $PWD "st-hunt-$i.json"
              $p = Start-Process -FilePath $exe -ArgumentList @('--selftest', '--selftest-out', $out) -PassThru
              $null = $p.Handle
              if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; "hunt ${i}: timed out"; continue }
              $j = Get-Content $out -Raw | ConvertFrom-Json
              foreach ($c in $j.checks) {
                  if ($c.name -eq 'loop.mainThreadStalls' -or -not $c.ok) {
                      "hunt {0} {1} {2}: {3}" -f $i, $(if ($c.ok) { 'PASS' } else { 'FAIL' }), $c.name, $c.detail
                  }
              }
          }
      - name: Version flag (informational)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        continue-on-error: true
        shell: pwsh
        run: |
          $v = & bundle\PokeTokenBar.exe --version | Out-String
          "--version printed: '$($v.Trim())'"
      - name: Crash on purpose, then relaunch (default log folder)
        if: (success() || failure()) && steps.package.outcome == 'success'  # independent evidence, also after a selftest failure
        shell: pwsh
        run: |
          # A child of the packaged exe installs the crash log like the app does and dies of a Swift fatalError (the
          # error mode is set in that child only). The log folder must then hold a crash record, a minidump and the
          # runtime's message; the next normal start must report the unclean end and take the record into the main log.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PtbCrashWin {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
              [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint msg, IntPtr w, IntPtr l);
          }
          '@
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $exe = (Resolve-Path bundle\PokeTokenBar.exe).Path
          $logs = Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs'
          Remove-Item -ErrorAction SilentlyContinue (Join-Path $logs 'PokeTokenBar-*.dmp'), (Join-Path $logs 'PokeTokenBar.crash.log'), (Join-Path $logs 'PokeTokenBar.running')
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest-crash', 'fatalError') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'the crash child did not end in 60 s' }
          'crash child exit: 0x{0:X8}' -f $p.ExitCode
          if ($p.ExitCode -eq 0) { throw 'the crash child exited 0' }
          $record = Get-Content (Join-Path $logs 'PokeTokenBar.crash.log') -Raw
          $record
          if ($record -notmatch '\[CRASH\] exception 0x[0-9A-F]{8} at 0x') { throw 'no crash record' }
          if ($record -notmatch '\[CRASH\] dump=off') { throw 'the record does not say dumps are off' }
          if (@(Get-ChildItem $logs -Filter 'PokeTokenBar-*.dmp').Count -ne 0) { throw 'a minidump was written without PTB_CRASH_DUMPS=1' }
          'no dump by default: ok'
          # Opted in: the same crash now also leaves a minidump.
          $env:PTB_CRASH_DUMPS = '1'
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest-crash', 'av') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'the opted-in crash child did not end in 60 s' }
          Remove-Item Env:PTB_CRASH_DUMPS
          'opted-in crash child exit: 0x{0:X8}' -f $p.ExitCode
          $dumps = @(Get-ChildItem $logs -Filter 'PokeTokenBar-*.dmp')
          "dumps: $($dumps.Name -join ', ') ($($dumps | ForEach-Object Length))"
          if ($dumps.Count -ne 1 -or $dumps[0].Length -le 0) { throw 'no minidump with PTB_CRASH_DUMPS=1' }
          if (-not (Test-Path (Join-Path $logs 'PokeTokenBar.running'))) { throw 'the running marker is gone after a crash' }
          if ((Get-Content (Join-Path $logs 'PokeTokenBar.stderr.log') -Raw) -notmatch 'selftest crash') { throw 'stderr.log lacks the fatalError message' }
          $env:PTB_STATE_DIR = Join-Path $env:PTB_FIXTURE 'state-crash'
          New-Item -ItemType Directory -Force -Path $env:PTB_STATE_DIR | Out-Null
          $app = Start-Process -FilePath $exe -PassThru
          $null = $app.Handle
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 150 -and $h -eq [IntPtr]::Zero; $i++) {
              Start-Sleep -Milliseconds 200
              if ($app.HasExited) { throw 'the relaunched app exited early' }
              $h = [PtbCrashWin]::FindWindowW('PokeTokenBarSink', [NullString]::Value)
          }
          if ($h -eq [IntPtr]::Zero) { throw 'the relaunched app made no sink window' }
          Start-Sleep -Seconds 2
          $null = [PtbCrashWin]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE
          if (-not $app.WaitForExit(20000)) { Stop-Process -Id $app.Id -Force; throw 'WM_CLOSE did not end the relaunched app' }
          "relaunched app exit: $($app.ExitCode)"
          $main = Get-Content (Join-Path $logs 'PokeTokenBar.log') -Raw
          foreach ($needle in 'previous session did not end cleanly', 'previous session crash record: [CRASH] exception') {
              if ($main -notmatch [regex]::Escape($needle)) { throw "the main log lacks: $needle" }
          }
          if (Test-Path (Join-Path $logs 'PokeTokenBar.running')) { throw 'the marker is still there after a clean exit' }
          if ((Get-Item (Join-Path $logs 'PokeTokenBar.crash.log')).Length -ne 0) { throw 'the crash record was not drained' }
          'relaunch reported the crash and ended cleanly'
      - name: Build the installers (this version, and a next one for the upgrade test)
        id: iscc
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
              $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after choco install innosetup' }
          $v = (Get-Content bundle\PokeTokenBar.version -Raw).Trim()
          $next = ($v -replace '\d+$', { [string]([int]$_.Value + 1) })
          Copy-Item bundle bundle-next -Recurse
          Set-Content -Path bundle-next\PokeTokenBar.version -Value $next -NoNewline
          foreach ($job in @(@{ Src = 'bundle'; Ver = $v; Out = 'installer-out' }, @{ Src = 'bundle-next'; Ver = $next; Out = 'installer-next' })) {
              New-Item -ItemType Directory -Force -Path $job.Out | Out-Null
              & $iscc /Q "/DSrcDir=$((Resolve-Path $job.Src).Path)" "/DAppVer=$($job.Ver)" "/DOutDir=$((Resolve-Path $job.Out).Path)" installer\PokeTokenBar.iss
              if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $($job.Ver)" }
          }
          "PTB_NEXT_VERSION=$next" >> $env:GITHUB_ENV
          foreach ($f in Get-ChildItem installer-out, installer-next -Filter *.exe) { '{0}: {1:N0} bytes' -f $f.FullName, $f.Length }
          'bundle: {0:N0} bytes in {1} files' -f ((Get-ChildItem bundle -Recurse -File | Measure-Object Length -Sum).Sum), (Get-ChildItem bundle -Recurse -File).Count
          if (-not (Test-Path "installer-out\PokeTokenBar-Setup-$v-win-x64.exe")) { throw 'the installer has not the expected name' }
      - name: Silent install and what it left
        id: install
        if: (success() || failure()) && steps.iscc.outcome == 'success'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          # A fresh profile on this throwaway runner: nothing of the earlier steps' settings or state.
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $PtbPlist, "$PtbPlist.bak", (Join-Path $env:LOCALAPPDATA 'PokeTokenBar')
          $v = $env:PTB_VERSION
          $setup = Resolve-Path "installer-out\PokeTokenBar-Setup-$v-win-x64.exe"
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/NOLAUNCH=1', "/LOG=$PWD\install.log" -Wait -PassThru
          Assert-That ($proc.ExitCode -eq 0) 'install.exit' "exit $($proc.ExitCode)"
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          Assert-That (Test-Path $exe) 'install.exe' $exe
          $same = (Get-FileHash $exe).Hash -eq (Get-FileHash bundle\PokeTokenBar.exe).Hash
          $missing = @(Get-ChildItem bundle -Recurse -File | Where-Object { -not (Test-Path (Join-Path $PtbInstallDir $_.FullName.Substring((Resolve-Path bundle).Path.Length + 1))) })
          Assert-That ($same -and $missing.Count -eq 0) 'install.files' "exe identical to the bundle's: $same; bundle files missing from the install: $($missing.Count)"
          Assert-That ((Get-Content (Join-Path $PtbInstallDir 'PokeTokenBar.version') -Raw).Trim() -eq $v) 'install.version' $v
          Assert-That (Test-Path (Join-Path $PtbInstallDir 'licenses\THIRD-PARTY.txt')) 'install.licenses' 'licenses\THIRD-PARTY.txt'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PokeTokenBar.lnk'
          Assert-That (Test-Path $lnk) 'install.startMenu' $lnk
          $shell = New-Object -ComObject Shell.Application
          $item = $shell.NameSpace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf))
          $aumid = $item.ExtendedProperty('System.AppUserModel.ID')
          Assert-That ($aumid -eq 'LikelionCampus.PokeTokenBar') 'install.aumid' "shortcut AppUserModelID='$aumid'"
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '{6CE57293-9940-4B5E-A604-4C4FEECBF049}*' }
          Assert-That ($null -ne $key) 'install.uninstallKey' "$($key.PSChildName) DisplayVersion=$($key.GetValue('DisplayVersion'))"
          Assert-That ($null -eq (Get-RunValue)) 'install.noRunValue' "HKCU Run PokeTokenBar: $(Get-RunValue)"
          Assert-That (-not (Get-Process PokeTokenBar -ErrorAction SilentlyContinue)) 'install.noLaunchWithFlag' '/NOLAUNCH=1 left no running instance'
          $item = Get-Item $exe
          "installed exe: $($item.VersionInfo.FileVersion) $($item.Length) bytes"
      - name: Upgrade over a running instance keeps settings and memberID
        id: upgrade
        if: (success() || failure()) && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          $logFile = Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\PokeTokenBar.log'
          # vN: run once so the app writes team.memberID, end it, then write a setting into the settings file.
          $p, $h = Start-App $exe
          Start-Sleep -Seconds 3
          $member = Get-MemberId
          Assert-That ([bool]$member) 'upgrade.memberIdWritten' "team.memberID=$member"
          Close-App $p $h
          $xml = Get-Content $PtbPlist -Raw
          $xml = $xml -replace '<key>statusChecksEnabled</key>\s*<(true|false)/>', ''
          $xml = $xml -replace '</dict>\s*</plist>\s*$', "<key>statusChecksEnabled</key><false/></dict></plist>"
          Set-Content -Path $PtbPlist -Value $xml -NoNewline -Encoding utf8NoBOM
          Assert-That ((Get-Content $PtbPlist -Raw) -match '<key>statusChecksEnabled</key>\s*<false/>') 'upgrade.settingWritten' 'statusChecksEnabled=false in PokeTokenBar.exe.plist'
          # vN is running when vN+1 is installed: the installer must close it (WM_CLOSE) and start the new one.
          $old, $oldHandle = Start-App $exe
          $closeLinesBefore = ([regex]::Matches((Get-Content $logFile -Raw), 'exit code=0 reason=closeRequest')).Count
          $next = $env:PTB_NEXT_VERSION
          $setup = Resolve-Path "installer-next\PokeTokenBar-Setup-$next-win-x64.exe"
          # No -Wait: it also waits for the app the installer starts. The setup itself must end by itself.
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$PWD\install-next.log" -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(180000)) { Stop-Process -Id $proc.Id -Force; Get-Content install-next.log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'the upgrade setup did not end in 180 s' }
          Assert-That ($proc.ExitCode -eq 0) 'upgrade.exit' "exit $($proc.ExitCode)"
          Assert-That ($old.HasExited -and $old.ExitCode -eq 0) 'upgrade.oldInstanceClosed' "old instance exited=$($old.HasExited) code=$($old.ExitCode)"
          $closeLinesAfter = ([regex]::Matches((Get-Content $logFile -Raw), 'exit code=0 reason=closeRequest')).Count
          Assert-That ($closeLinesAfter -eq $closeLinesBefore + 1) 'upgrade.closedCleanly' "closeRequest exit lines $closeLinesBefore -> $closeLinesAfter"
          Assert-That ((Get-Content (Join-Path $PtbInstallDir 'PokeTokenBar.version') -Raw).Trim() -eq $next) 'upgrade.filesReplaced' "version file = $next"
          # The installer launches the new version also when silent.
          $fresh = $null
          for ($i = 0; $i -lt 100 -and -not $fresh; $i++) { Start-Sleep -Milliseconds 200; $fresh = Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Select-Object -First 1 }
          Assert-That ($null -ne $fresh) 'upgrade.relaunched' 'a PokeTokenBar process runs after the silent upgrade'
          $null = $fresh.Handle
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 100 -and $h -eq [IntPtr]::Zero; $i++) { Start-Sleep -Milliseconds 200; $h = Find-Sink }
          Start-Sleep -Seconds 2
          $after = Get-MemberId
          Assert-That ($after -eq $member) 'upgrade.memberIdKept' "before=$member after=$after"
          Assert-That ((Get-Content $PtbPlist -Raw) -match '<key>statusChecksEnabled</key>\s*<false/>') 'upgrade.settingKept' 'statusChecksEnabled still false after the upgrade'
          Close-App $fresh $h
      - name: Installed selftest (stripped Path, from the install folder)
        id: installed-selftest
        if: (success() || failure()) && steps.upgrade.outcome != 'skipped'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $state = Join-Path $env:PTB_FIXTURE 'state-installed'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          $env:PTB_STATE_DIR = $state
          $env:PTB_SELFTEST_EXPECT_TODAY_TOKENS = '3702'
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          ./scripts/windows/run-selftest.ps1 -Exe $exe -Out st-installed.json -ExpectStrategy cfRunLoopWithMessages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The checks that only mean something from a packaged copy must have run for real, not been skipped.
          $j = Get-Content st-installed.json -Raw | ConvertFrom-Json
          foreach ($name in 'packaged.processName', 'packaged.version', 'packaged.modules', 'log.writes') {
              $c = $j.checks | Where-Object { $_.name -eq $name }
              Assert-That ($c -and $c.ok -and $c.detail -notlike 'skipped*') "installed.$name" $c.detail
          }
          "executed selftest checks: $(@($j.checks).Count)"
      - name: Idle gate (installed app, fixture data, 5 minute window with two store refreshes)
        id: idle
        if: (success() || failure()) && steps.install.outcome == 'success' && inputs.fast != 'true'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:PTB_FIXTURE 'claude'
          $verdicts = [ordered]@{}
          $summary = [ordered]@{ version = $env:PTB_VERSION; runner = $env:ImageVersion; windows = [ordered]@{} }

          # 1. A process that only sleeps, and explorer, over the same 120 s, before the app starts.
          $ps = Join-Path $env:windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $sleeper = Start-Process -FilePath $ps -ArgumentList '-NoProfile', '-Command', 'Start-Sleep 170' -PassThru
          Start-Sleep -Seconds 5
          ./scripts/windows/measure-idle.ps1 -ProcessId $sleeper.Id -Seconds 120 -Also explorer -Baseline -Label sleeper -Out idle-sleeper.json
          Stop-Process -Id $sleeper.Id -Force -ErrorAction SilentlyContinue
          $base = Get-Content idle-sleeper.json -Raw | ConvertFrom-Json
          $summary.sleeper = [ordered]@{ cyclesPerSec = $base.processCyclesPerSec; contextSwitchesPerMin = $base.contextSwitchesPerMin; explorerCycles = $base.explorerCycles; explorerContextSwitches = ($base.also | Where-Object name -eq 'explorer').contextSwitches }

          # 2. The installed app, one window per state. Budgets are from the first measured runs, with margin (see the report).
          function Measure-App([string]$Label, [int]$Seconds, [string]$Settings, [hashtable]$Budget) {
              Remove-Item -ErrorAction SilentlyContinue $PtbPlist, "$PtbPlist.bak"
              if ($Settings) { Set-Content -Path $PtbPlist -Value $Settings -Encoding utf8NoBOM }
              $state = Join-Path $env:PTB_FIXTURE "state-idle-$Label"
              New-Item -ItemType Directory -Force -Path $state | Out-Null
              $env:PTB_STATE_DIR = $state
              $p, $h = Start-App $exe
              Start-Sleep -Seconds 30
              $m = @{ ProcessId = $p.Id; Seconds = $Seconds; Label = $Label; Out = "idle-$Label.json" }
              foreach ($k in $Budget.Keys) { $m[$k] = $Budget[$k] }
              ./scripts/windows/measure-idle.ps1 @m
              $code = $LASTEXITCODE
              Close-App $p $h
              $verdicts[$Label] = ($code -eq 0)
              $j = Get-Content "idle-$Label.json" -Raw | ConvertFrom-Json
              $summary.windows[$Label] = [ordered]@{ seconds = $Seconds; pass = ($code -eq 0); budget = $Budget; processCycles = $j.processCycles; cyclesPerSec = $j.processCyclesPerSec; cpuSeconds = $j.processCpuSeconds; contextSwitchesPerMin = $j.contextSwitchesPerMin; mainThreadContextSwitches = $j.mainThreadContextSwitches; privateMB = "$($j.privateMBStart) -> $($j.privateMBEnd)"; handles = "$($j.handlesStart) -> $($j.handlesEnd)"; threads = @($j.threads | Where-Object { $_.contextSwitches -gt 0 } | Select-Object tid, main, name, start, contextSwitches, cycles) }
          }
          $off = '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>refreshInterval</key><real>0</real></dict></plist>'
          $offNoStatus = '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>refreshInterval</key><real>0</real><key>statusChecksEnabled</key><false/></dict></plist>'
          $noStatus = '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>statusChecksEnabled</key><false/></dict></plist>'
          $budget = @{ MaxMainCsPerMin = 6; MaxProcessCsPerMin = 400; MaxPrivateGrowthMB = 25; MaxHandleGrowth = 20 }
          # refreshInterval = 0: nothing is due after the launch refresh (the D8 window), 120 s.
          Measure-App 'manual-refresh-120s' 120 $off $budget
          # The normal app: 120 s polling, status checks on. 300 s from 30 s after launch covers the refreshes at +120 s and +240 s.
          Measure-App 'normal-300s' 300 '' @{ MaxMainCsPerMin = 10; MaxProcessCsPerMin = 400; MaxPrivateGrowthMB = 40; MaxHandleGrowth = 30 }
          # Hypothesis for the ~1 Hz threads: no status checks (one network user fewer), report only.
          Measure-App 'no-status-checks-120s' 120 $offNoStatus @{}
          $summary.verdicts = $verdicts
          $summary | ConvertTo-Json -Depth 8 | Set-Content idle-gate.json -Encoding utf8
          Get-Content idle-gate.json
          if ($verdicts.Values -contains $false) { throw "idle gate FAILED: $(($verdicts.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object Key) -join ', ')" }
          'PASS idle gate'
      - name: Waker hunt (the two ~1 Hz threads; diagnostics)
        if: (success() || failure()) && steps.install.outcome == 'success' && inputs.fast != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:Path = 'C:\Windows\System32;C:\Windows'
          $state = Join-Path $env:PTB_FIXTURE 'state-hunt'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          $env:PTB_STATE_DIR = $state
          $out = Join-Path $PWD 'waker-hunt.json'
          $p = Start-Process -FilePath (Join-Path $PtbInstallDir 'PokeTokenBar.exe') -ArgumentList '--selftest-waker-hunt', $out, '30' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; throw 'the waker hunt did not finish in 15 min' }
          "exit $($p.ExitCode)"
          foreach ($ph in (Get-Content $out -Raw | ConvertFrom-Json)) { "== $($ph.phase)"; $ph.detail }
      - name: Waker modes (what each way of waiting costs on its own; diagnostics)
        if: (success() || failure()) && steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          $modes = [ordered]@{
              'none' = @('none'); 'distant' = @('distant'); 'task' = @('task'); 'taskmain' = @('taskmain'); 'tasksleep' = @('tasksleep');
              'thread' = @('thread'); 'globalqueue' = @('globalqueue'); 'mainqueue' = @('mainqueue'); 'asyncafter' = @('asyncafter');
              'dispatchtimer' = @('dispatchtimer');
              'timer-20-2' = @('timer', '20', '2'); 'timer-20-0' = @('timer', '20', '0');
              'timertask-20-2' = @('timer', '20', '2', 'task'); 'timertask-20-0' = @('timer', '20', '0', 'task')
          }
          $procs = @{}
          foreach ($k in $modes.Keys) { $procs[$k] = Start-Process -FilePath $exe -ArgumentList (@('--selftest-park') + $modes[$k]) -PassThru }
          Start-Sleep -Seconds 15
          # All windows at once, each measured by its own pwsh, so the whole set costs one window.
          $meas = @{}
          foreach ($k in $modes.Keys) {
              if ($procs[$k].HasExited) { "mode ${k}: exited early ($($procs[$k].ExitCode))"; continue }
              $meas[$k] = Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', (Resolve-Path ./scripts/windows/measure-idle.ps1).Path, '-ProcessId', $procs[$k].Id, '-Seconds', 90, '-Label', "park-$k", '-Out', "idle-park-$k.json" -RedirectStandardOutput "park-$k.txt" -PassThru
          }
          foreach ($k in $meas.Keys) { $null = $meas[$k].WaitForExit(300000) }
          foreach ($k in $modes.Keys) { if (Test-Path "park-$k.txt") { Get-Content "park-$k.txt" } }
          foreach ($k in $modes.Keys) { Stop-Process -Id $procs[$k].Id -Force -ErrorAction SilentlyContinue }
      - name: Silent uninstall and what it leaves
        id: uninstall
        if: (success() || failure()) && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          . ./scripts/windows/ci-helpers.ps1
          Get-Process PokeTokenBar -ErrorAction SilentlyContinue | Stop-Process -Force
          $data = Join-Path $env:LOCALAPPDATA 'PokeTokenBar'
          # What the app's tray toggle would have written: the Run value that starts THIS install.
          $exe = Join-Path $PtbInstallDir 'PokeTokenBar.exe'
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'PokeTokenBar' -Value "`"$exe`" --autostart"
          Assert-That ($null -ne (Get-RunValue)) 'uninstall.runValueSetUp' (Get-RunValue)
          # Leave something in the app's folder too: the uninstaller takes the folder, not just its own files.
          Set-Content -Path (Join-Path $PtbInstallDir 'stray.txt') -Value 'x'
          $before = @(Get-ChildItem $data -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $plistBefore = Test-Path $PtbPlist
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '{6CE57293-9940-4B5E-A604-4C4FEECBF049}*' }
          $unins = (Get-Item (Join-Path $PtbInstallDir 'unins000.exe')).FullName
          $proc = Start-Process -FilePath $unins -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\uninstall.log" -Wait -PassThru
          Assert-That ($proc.ExitCode -eq 0) 'uninstall.exit' "exit $($proc.ExitCode)"
          for ($i = 0; $i -lt 60 -and (Test-Path $PtbInstallDir); $i++) { Start-Sleep -Milliseconds 500 }  # the uninstaller deletes itself after it exits
          Assert-That (-not (Test-Path $PtbInstallDir)) 'uninstall.appFolderGone' $PtbInstallDir
          Assert-That ($null -eq (Get-RunValue)) 'uninstall.runValueGone' "Run PokeTokenBar: $(Get-RunValue)"
          Assert-That (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PokeTokenBar.lnk'))) 'uninstall.startMenuGone' 'Start-menu shortcut removed'
          $keyAfter = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '{6CE57293-9940-4B5E-A604-4C4FEECBF049}*' }
          Assert-That ($null -eq $keyAfter) 'uninstall.keyGone' 'Uninstall registry key removed'
          $after = @(Get-ChildItem $data -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          Assert-That ($plistBefore -and (Test-Path $PtbPlist) -and $after.Count -ge $before.Count) 'uninstall.dataKept' "settings plist kept: $(Test-Path $PtbPlist); files under %LOCALAPPDATA%\PokeTokenBar: $($before.Count) before, $($after.Count) after"
          "left behind: $PtbPlist (+ .bak: $(Test-Path "$PtbPlist.bak")); $data ($($after.Count) files: $((($after | ForEach-Object { Split-Path $_ -Leaf }) | Select-Object -First 12) -join ', '))"
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path collected | Out-Null
          Copy-Item -ErrorAction SilentlyContinue (Join-Path $env:LOCALAPPDATA 'PokeTokenBar\Logs\*') collected
          Copy-Item -ErrorAction SilentlyContinue (Join-Path $env:LOCALAPPDATA '*.plist') collected
          Copy-Item -ErrorAction SilentlyContinue install.log, install-next.log, uninstall.log, package.log collected
          Get-ChildItem collected | ForEach-Object { $_.Name }
      # The installer is a CI artifact only (short retention): nothing is attached to a release or uploaded elsewhere.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: installer-out/PokeTokenBar-Setup-*-win-x64.exe
          retention-days: 3
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-app
          retention-days: 7
          path: |
            bundle
            st*.json
            idle*.json
            waker-hunt.json
            st*.json.lines
            tray-desktop.png
            ui-dump
            collected
            build.log
            .build/*/release/PokeTokenBarWin.pdb
